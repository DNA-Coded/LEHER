services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leher_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      # Mount the data fabric directory so all Zarr datasets and ML artifacts persist on the VPS
      - ./backend/fabric:/app/fabric
    environment:
      - ENV=production
      - LEHER_ALLOWED_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:alpine
    container_name: leher_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from leher-api.eastasia.cloudapp.azure.com --to backend:8000
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
