<!DOCTYPE html>
<html class="dark" style="color-scheme: dark; background: transparent !important; background-color: transparent !important;">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>The globe of extremes</title>

  <link rel="stylesheet" href="https://js.arcgis.com/4.22/esri/themes/light/main.css" />
  <link rel="stylesheet" href="./style.css?v=4" />
  <style>
    :root {
      color-scheme: dark !important;
    }
    html, body, #viewDiv, #viewDiv canvas, .esri-view, .esri-view-surface {
      padding: 0 !important;
      margin: 0 !important;
      height: 100% !important;
      width: 100% !important;
      background-color: transparent !important;
      background: transparent !important;
      color-scheme: dark !important;
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
      filter: none !important;
      -webkit-filter: none !important;
      overflow: hidden !important;
    }
    .esri-attribution, .esri-attribution__sources, .esri-attribution__link, a {
      display: none !important;
    }
  </style>

  <script>
    var currentPath = window.location.pathname;
    var baseDir = currentPath.substring(0, currentPath.lastIndexOf('/'));
    if (!baseDir) baseDir = "/globe";
    var dojoConfig = {
      packages: [{
        name: "utils",
        location: baseDir + "/utils"
      }],
      async: true
    };
  </script>

  <script src="https://js.arcgis.com/4.22/"></script>
  <script>
    require([
      "esri/Map",
      "esri/views/SceneView",
      "esri/layers/TileLayer",
      "esri/layers/GeoJSONLayer",
      "esri/Basemap",

      "utils/ExaggeratedElevationLayer",

      "esri/Graphic",
      "esri/geometry/Point",
      "esri/geometry/Mesh",

      "esri/core/watchUtils"
    ], function (Map, SceneView, TileLayer, GeoJSONLayer, Basemap, ExaggeratedElevationLayer, Graphic, Point, Mesh, watchUtils) {

      const R = 6358137; // approximate radius of the Earth in m
      const offset = 300000; // offset from the ground used for the clouds

      const basemap = new Basemap({
        baseLayers: [
          new TileLayer({
            url: "https://tiles.arcgis.com/tiles/nGt4QxSblgDfeJn9/arcgis/rest/services/terrain_with_heavy_bathymetry/MapServer"
          })
        ]
      });

      const map = new Map({
        basemap: basemap
      });

      const view = new SceneView({
        container: "viewDiv",
        map: map,
        alphaCompositingEnabled: true,
        qualityProfile: "high",
        camera: {
          position: [-55.03975781, 14.94826384, 19921223.30821],
          heading: 2.03,
          tilt: 0.13
        },
        environment: {
          background: {
            type: "color",
            color: [0, 0, 0, 0]
          },
          starsEnabled: false,
          atmosphereEnabled: false,
          lighting: {
            directShadowsEnabled: false,
            date: "Sun Jun 23 2019 19:19:18 GMT+0200 (Central European Summer Time)"
          }
        },
        constraints: {
          altitude: {
            min: 10000000,
            max: 25000000
          }
        },
        popupEnabled: false
      });

      view.ui.components = [];

      // Forward wheel events to parent window so landing page scrolling remains fluid
      window.addEventListener("wheel", function (e) {
        if (window.parent && window.parent !== window) {
          window.parent.scrollBy({
            top: e.deltaY,
            left: e.deltaX,
            behavior: "auto"
          });
        }
      }, { passive: true });

      view.on("mouse-wheel", function (event) {
        event.stopPropagation();
      });

      map.ground.layers = [new ExaggeratedElevationLayer({
        exaggerationBathymetry: 60,
        exaggerationTopography: 40
      })];

      const origin = new Point({
        x: 0, y: -90, z: -(2 * R)
      });

      const oceanSurfaceMesh = Mesh.createSphere(
        origin, {
        size: {
          width: 2 * R,
          depth: 2 * R,
          height: 2 * R
        },
        densificationFactor: 5,
        material: {
          color: [0, 210, 210, 0.8],
          metallic: 0.9,
          roughness: 0.8,
          doubleSided: false
        }
      });

      const oceanSurface = new Graphic({
        geometry: oceanSurfaceMesh,
        symbol: {
          type: "mesh-3d",
          symbolLayers: [{
            type: "fill"
          }]
        }
      });

      view.graphics.add(oceanSurface);

      const cloudsSphere = Mesh.createSphere(new Point({
        x: 0, y: -90, z: -(2 * R + offset)
      }), {
        size: 2 * (R + offset),
        material: {
          colorTexture: (baseDir || '/globe') + '/clouds-nasa.png',
          doubleSided: false
        },
        densificationFactor: 4
      });

      cloudsSphere.components[0].shading = "flat";

      const clouds = new Graphic({
        geometry: cloudsSphere,
        symbol: {
          type: "mesh-3d",
          symbolLayers: [{ type: "fill" }]
        }
      });

      view.graphics.add(clouds);

      let isPaused = false;
      view.on("click", function () {
        isPaused = !isPaused;
      });

      view.when(function () {
        if (view.container) {
          view.container.style.filter = "none";
        }
        watchUtils.whenFalseOnce(view, "updating", rotate);
      });

      function rotate() {
        if (!view.interacting && !isPaused) {
          const camera = view.camera.clone();
          camera.position.longitude += 0.2;
          view.goTo(camera, { animate: false });
        }
        requestAnimationFrame(rotate);
      }
    });
  </script>
</head>

<body>
  <div id="viewDiv"></div>
</body>

</html>
