<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEHER — 3D Volumetric Depth Slice</title>
  <meta name="description" content="Standalone 3D Volumetric Ocean Depth Slice Viewer with telemetry data panel" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #010a18;
      --bg-panel: rgba(3, 14, 28, 0.94);
      --cyan: #00e5ff;
      --cyan-dim: #7aa0c4;
      --green: #00f5a0;
      --orange: #ff7a36;
      --purple: #c084fc;
      --white: #e2f1ff;
      --border-cyan: rgba(0, 220, 255, 0.3);
      --border-dim: rgba(255, 255, 255, 0.08);
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Consolas', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg-primary);
      font-family: var(--font-sans);
      color: var(--white);
    }

    #app {
      width: 100vw; height: 100vh;
      display: flex;
      position: relative;
      background: radial-gradient(ellipse at 50% 30%, #031c38 0%, #010a18 70%, #00040a 100%);
    }

    /* ── 3D Canvas Area ──────────────────────────────────────────────── */
    #canvas-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #three-canvas {
      width: 100%; height: 100%;
      display: block;
    }

    /* ── Top Controls Bar ────────────────────────────────────────────── */
    #top-controls {
      position: absolute;
      top: 16px; left: 16px; right: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 10;
      pointer-events: none;
      transition: right 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #top-controls.side-collapsed { right: 16px; }

    .ctrl-glass {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(5, 18, 38, 0.88);
      backdrop-filter: blur(16px);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-cyan);
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }

    .title-icon {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #00d2ff, #0055ff);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 14px rgba(0, 210, 255, 0.5);
      flex-shrink: 0;
    }
    .title-icon svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .title-text h2 {
      font-size: 13px; font-weight: 700; color: #fff;
      letter-spacing: 0.5px;
      display: flex; align-items: center; gap: 8px;
    }
    .badge {
      font-size: 8.5px; font-weight: 800; text-transform: uppercase;
      padding: 2px 7px; border-radius: 4px;
      background: rgba(0, 245, 160, 0.18); color: var(--green);
      border: 1px solid rgba(0, 245, 160, 0.4);
      letter-spacing: 0.5px;
    }
    .title-sub {
      font-size: 11px; color: var(--cyan-dim); font-family: var(--font-mono);
      margin-top: 1px;
    }

    /* Toggle group */
    .toggle-group {
      display: flex;
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      padding: 2px;
    }
    .toggle-btn {
      padding: 6px 11px; border-radius: 6px; border: none;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; font-family: var(--font-sans);
      background: transparent; color: var(--cyan-dim);
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: linear-gradient(135deg, #00d2ff, #0088ff);
      color: #fff;
    }
    .toggle-btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .var-btn {
      padding: 6px 10px; border-radius: 6px; border: none;
      cursor: pointer; font-size: 11px; font-weight: 600; font-family: var(--font-sans);
      background: transparent; color: var(--cyan-dim); transition: all 0.2s;
    }
    .var-btn.active {
      background: rgba(0, 229, 255, 0.25); color: var(--cyan);
    }

    .icon-btn {
      width: 32px; height: 32px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05); color: var(--white);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .icon-btn:hover { background: rgba(0, 210, 255, 0.2); }
    .icon-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── Bottom helper pill ───────────────────────────────────────────── */
    #orbit-hint {
      position: absolute; bottom: 20px; left: 20px;
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 20px;
      background: rgba(2, 11, 24, 0.75); backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 220, 255, 0.2);
      color: var(--cyan-dim); font-size: 11px;
      pointer-events: none;
    }
    #orbit-hint svg { width: 13px; height: 13px; fill: none; stroke: #00d2ff; stroke-width: 2; }

    /* ── Depth Slider Bottom Bar ──────────────────────────────────────── */
    #depth-bar {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-60%);
      display: flex; align-items: center; gap: 14px;
      background: rgba(3, 14, 28, 0.92); backdrop-filter: blur(16px);
      border: 1px solid var(--border-cyan); border-radius: 14px;
      padding: 8px 18px; z-index: 10;
    }
    #depth-bar .depth-label {
      font-size: 12px; color: var(--cyan); font-weight: 600;
      white-space: nowrap;
    }
    #depth-bar .depth-label span { color: #fff; font-weight: 700; }
    #depth-bar input[type="range"] {
      width: 180px; height: 5px;
      -webkit-appearance: none; appearance: none;
      background: linear-gradient(90deg, #00f0ff 0%, #0077ff 50%, #001f4d 100%);
      border-radius: 3px; outline: none; cursor: pointer;
    }
    #depth-bar input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: #00e5ff;
      border: 2px solid #fff; box-shadow: 0 0 8px rgba(0,229,255,0.6);
      cursor: grab;
    }
    #depth-bar .tick-marks {
      display: flex; gap: 12px; font-size: 10px;
      color: #6088aa; font-family: var(--font-mono);
    }
    #depth-bar .tick-marks span { cursor: pointer; transition: color 0.15s; }
    #depth-bar .tick-marks span:hover { color: var(--green); }
    #depth-bar .tick-marks span.active { color: var(--green); font-weight: 700; }

    /* ── Side Data Panel ─────────────────────────────────────────────── */
    #side-panel {
      width: 380px; max-width: 380px;
      height: 100vh;
      background: var(--bg-panel);
      backdrop-filter: blur(24px);
      border-left: 1px solid var(--border-cyan);
      display: flex; flex-direction: column;
      box-shadow: -16px 0 50px rgba(0,0,0,0.5), 0 0 25px rgba(0,180,255,0.08);
      z-index: 20; overflow: hidden;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #side-panel.collapsed { transform: translateX(100%); width: 0; min-width: 0; }

    /* Collapse trigger */
    #collapse-trigger {
      position: absolute; top: 80px; right: 16px; z-index: 30;
      display: none; align-items: center; gap: 8px;
      background: rgba(3, 14, 28, 0.92); backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 220, 255, 0.4); border-radius: 24px;
      padding: 8px 16px; color: var(--cyan); font-size: 12px; font-weight: 700;
      cursor: pointer; box-shadow: 0 8px 30px rgba(0,0,0,0.7), 0 0 16px rgba(0,220,255,0.25);
      transition: all 0.2s;
    }
    #collapse-trigger:hover { background: rgba(0, 40, 80, 0.95); transform: scale(1.03); }
    #collapse-trigger.visible { display: flex; }
    #collapse-trigger svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

    /* Panel header */
    .panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(0, 220, 255, 0.15);
      background: linear-gradient(180deg, rgba(0, 220, 255, 0.08) 0%, transparent 100%);
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .panel-header .ml-badge {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1px; padding: 2px 7px; border-radius: 5px;
      background: rgba(0, 229, 255, 0.18); color: var(--cyan);
      border: 1px solid rgba(0, 229, 255, 0.35);
    }
    .panel-header .basin { font-size: 12px; color: var(--cyan-dim); font-weight: 600; margin-left: 8px; }
    .panel-header h3 { margin: 4px 0 0; font-size: 17px; font-weight: 700; color: #fff; }
    .panel-header .coords { font-size: 11px; color: #00d2ff; font-family: var(--font-mono); margin-top: 2px; }

    .header-actions { display: flex; align-items: center; gap: 6px; }
    .header-btn {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      color: #80d8ff; cursor: pointer; transition: all 0.2s;
    }
    .header-btn:hover { background: rgba(0, 210, 255, 0.25); }
    .header-btn.close:hover { background: rgba(255, 60, 60, 0.35); color: #fff; }
    .header-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Panel tabs */
    .panel-tabs {
      display: flex; padding: 6px 14px; gap: 6px;
      background: rgba(0,0,0,0.25);
      border-bottom: 1px solid rgba(0, 220, 255, 0.1);
    }
    .tab-btn {
      flex: 1; padding: 6px 0; font-size: 11px; font-weight: 700;
      border-radius: 6px; border: none; cursor: pointer;
      background: transparent; color: var(--cyan-dim);
      font-family: var(--font-sans); transition: all 0.2s;
    }
    .tab-btn.active { background: rgba(0, 229, 255, 0.2); color: var(--cyan); }

    /* Panel body */
    .panel-body {
      flex: 1; overflow-y: auto; padding: 14px 18px;
      scrollbar-width: thin; scrollbar-color: rgba(0,229,255,0.2) transparent;
    }
    .panel-body::-webkit-scrollbar { width: 5px; }
    .panel-body::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.2); border-radius: 3px; }
    .panel-body::-webkit-scrollbar-track { background: transparent; }

    /* ── Depth Selector Card ─────────────────────────────────────────── */
    .depth-selector {
      background: linear-gradient(135deg, rgba(0,25,55,0.75) 0%, rgba(0,15,35,0.85) 100%);
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 12px; padding: 12px 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      margin-bottom: 14px;
    }
    .depth-selector .ds-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .ds-header .ds-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 700; color: var(--white);
    }
    .ds-header .ds-label svg { width: 14px; height: 14px; fill: none; stroke: var(--cyan); stroke-width: 2; }
    .ds-badge {
      background: rgba(0, 245, 160, 0.15); border: 1px solid rgba(0, 245, 160, 0.4);
      padding: 2px 9px; border-radius: 8px;
      font-size: 13px; font-weight: 800; color: var(--green);
      font-family: var(--font-mono);
    }
    .zone-label { font-size: 11px; color: var(--cyan-dim); margin-bottom: 10px; }
    .zone-label span { color: var(--cyan); font-weight: 600; }

    .ds-slider {
      width: 100%; height: 6px; border-radius: 3px; outline: none; cursor: pointer;
      -webkit-appearance: none; appearance: none;
      background: linear-gradient(90deg, #00f0ff 0%, #0077ff 50%, #001f4d 100%);
      margin: 6px 0 10px;
    }
    .ds-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--cyan);
      border: 2px solid #fff; box-shadow: 0 0 8px rgba(0,229,255,0.5);
    }
    .ds-ticks {
      display: flex; justify-content: space-between;
      font-size: 10px; color: #6088aa; font-family: var(--font-mono);
      padding: 0 2px;
    }
    .ds-ticks span { cursor: pointer; transition: color 0.15s; }
    .ds-ticks span:hover { color: var(--green); }
    .ds-ticks span.active { color: var(--green); }

    .ds-presets {
      display: flex; gap: 5px; margin-top: 10px;
    }
    .preset-btn {
      flex: 1; padding: 4px 2px; border-radius: 6px;
      font-size: 9px; font-weight: 700; font-family: var(--font-sans);
      border: 1px solid var(--border-dim);
      background: rgba(255,255,255,0.04); color: #88aacc;
      cursor: pointer; transition: all 0.15s;
    }
    .preset-btn.active {
      border-color: var(--green); background: rgba(0, 245, 160, 0.18);
      color: var(--green);
    }

    /* ── Metric Cards Grid ───────────────────────────────────────────── */
    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 14px; }

    .metric-card {
      background: rgba(0, 30, 60, 0.5);
      border-radius: 10px; padding: 11px;
    }
    .metric-card .mc-label {
      display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
    }
    .metric-card .mc-label svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
    .metric-card .mc-value {
      font-size: 22px; font-weight: 800; color: #fff;
    }
    .metric-card .mc-value .unit { font-size: 12px; font-weight: 500; margin-left: 4px; }
    .metric-card .mc-sub { font-size: 10px; color: var(--cyan-dim); margin-top: 2px; }

    .mc-temp { border: 1px solid rgba(255, 120, 60, 0.3); }
    .mc-temp .mc-label { color: #ff9d6b; }
    .mc-temp .mc-value .unit { color: #ffaa77; }

    .mc-sal { border: 1px solid rgba(0, 229, 255, 0.3); }
    .mc-sal .mc-label { color: var(--cyan); }
    .mc-sal .mc-value .unit { color: #88e0ff; }

    .mc-vel { border: 1px solid rgba(0, 245, 160, 0.3); }
    .mc-vel .mc-label { color: var(--green); }
    .mc-vel .mc-value .unit { color: #70ffcc; }

    .mc-dir { border: 1px solid rgba(160, 100, 255, 0.3); }
    .mc-dir .mc-label { color: var(--purple); }
    .mc-dir .mc-value .unit { color: var(--purple); }

    /* ── Velocity Components Card ────────────────────────────────────── */
    .velocity-card {
      background: rgba(0, 20, 45, 0.5);
      border: 1px solid rgba(0, 220, 255, 0.18);
      border-radius: 10px; padding: 11px 13px; margin-bottom: 14px;
    }
    .vc-title { font-size: 11px; font-weight: 700; color: #8ec5fc; margin-bottom: 8px; }
    .vc-row { display: flex; justify-content: space-between; gap: 10px; }
    .vc-cell {
      flex: 1; background: rgba(0,0,0,0.3); padding: 7px; border-radius: 6px;
    }
    .vc-cell .vc-label { font-size: 10px; color: var(--cyan-dim); }
    .vc-cell .vc-val { font-size: 14px; font-weight: 700; margin-top: 2px; }
    .vc-cell .vc-val.pos { color: var(--green); }
    .vc-cell .vc-val.neg { color: #ff7a7a; }

    /* ── Chlorophyll Card ─────────────────────────────────────────────── */
    .chl-card {
      background: rgba(0, 35, 20, 0.5);
      border: 1px solid rgba(76, 175, 80, 0.3);
      border-radius: 10px; padding: 11px 13px; margin-bottom: 14px;
    }
    .chl-card .mc-label { color: #81c784; }
    .chl-card .mc-value .unit { color: #a5d6a7; }

    /* ── Stratification Metrics Card ─────────────────────────────────── */
    .strat-card {
      background: rgba(0, 25, 55, 0.6);
      border: 1px solid rgba(0, 220, 255, 0.25);
      border-radius: 12px; padding: 12px; margin-bottom: 14px;
    }
    .strat-card .sc-title {
      display: flex; align-items: center; gap: 7px; margin-bottom: 8px;
      font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 0.4px;
    }
    .strat-card .sc-title svg { width: 14px; height: 14px; fill: none; stroke: var(--cyan); stroke-width: 2; }
    .strat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .strat-item {
      background: rgba(0,0,0,0.25); padding: 7px 9px; border-radius: 8px;
    }
    .strat-item .si-label { font-size: 10px; color: var(--cyan-dim); }
    .strat-item .si-value { font-size: 15px; font-weight: 700; margin-top: 2px; }

    /* ── Model Provenance Card ───────────────────────────────────────── */
    .model-card {
      background: rgba(0, 15, 35, 0.5);
      border: 1px solid var(--border-dim);
      border-radius: 10px; padding: 10px 12px; margin-bottom: 14px;
    }
    .model-card .md-title {
      display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
      font-size: 11px; font-weight: 700; color: var(--green);
    }
    .model-card .md-title svg { width: 13px; height: 13px; fill: none; stroke: var(--green); stroke-width: 2; }
    .r2-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; text-align: center; }
    .r2-item { background: rgba(255,255,255,0.03); padding: 5px 2px; border-radius: 6px; }
    .r2-item .r2-label { font-size: 9px; color: var(--cyan-dim); }
    .r2-item .r2-val { font-size: 11px; font-weight: 700; margin-top: 1px; }

    /* ── Layers Tab ──────────────────────────────────────────────────── */
    .layers-list { display: flex; flex-direction: column; gap: 7px; }
    .layers-hint { font-size: 11px; color: var(--cyan-dim); margin-bottom: 4px; }
    .layer-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 11px; border-radius: 8px;
      background: rgba(0, 20, 40, 0.4); border: 1px solid var(--border-dim);
      cursor: pointer; transition: all 0.15s;
    }
    .layer-row:hover { background: rgba(0, 60, 100, 0.3); }
    .layer-row.selected {
      background: rgba(0, 229, 255, 0.2); border-color: var(--cyan);
    }
    .layer-left { display: flex; align-items: center; gap: 9px; }
    .layer-depth {
      width: 36px; height: 22px; border-radius: 4px;
      background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: #8ec5fc;
    }
    .layer-row.selected .layer-depth { color: var(--green); }
    .layer-vals span:first-child { font-size: 12px; font-weight: 700; color: #fff; }
    .layer-vals span:last-child { font-size: 10px; color: var(--cyan-dim); margin-left: 7px; }
    .layer-speed { font-size: 11px; font-family: var(--font-mono); color: var(--green); }

    /* ── Profile Tab ─────────────────────────────────────────────────── */
    .profile-title { font-size: 12px; font-weight: 700; color: #fff; margin-bottom: 10px; }
    .profile-chart {
      width: 100%; height: 240px;
      background: rgba(0, 10, 25, 0.6); border-radius: 10px;
      border: 1px solid rgba(0, 220, 255, 0.2); padding: 10px;
    }
    .profile-chart svg { width: 100%; height: 100%; }
    .profile-legend { display: flex; gap: 14px; margin-top: 8px; font-size: 10px; }
    .profile-legend .leg-item { display: flex; align-items: center; gap: 5px; }
    .leg-color { width: 12px; height: 3px; border-radius: 2px; }

    /* ── Animations ──────────────────────────────────────────────────── */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fade-in { animation: fadeIn 0.4s ease forwards; }

    /* ── Responsive ──────────────────────────────────────────────────── */
    @media (max-width: 860px) {
      #side-panel { width: 320px; max-width: 320px; }
      #top-controls { right: 336px; }
      #top-controls.side-collapsed { right: 16px; }
    }
    @media (max-width: 640px) {
      #side-panel { width: 100vw; max-width: 100vw; position: absolute; right: 0; top: 0; }
      #top-controls { right: 16px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 3D Canvas Area -->
    <div id="canvas-area">
      <canvas id="three-canvas"></canvas>

      <!-- Top Controls -->
      <div id="top-controls">
        <!-- Title Badge -->
        <div class="ctrl-glass">
          <div class="title-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <div class="title-text">
            <h2>
              3D Volumetric Depth Slice
              <span class="badge">Independent 3D Scene</span>
            </h2>
            <div class="title-sub">12.5162°N, 66.8899°E • Arabian Sea</div>
          </div>
        </div>

        <!-- Shape & Variable Controls -->
        <div class="ctrl-glass" style="padding: 6px 12px;">
          <!-- Geometry toggle -->
          <div class="toggle-group" id="geometry-toggle">
            <button class="toggle-btn active" data-geo="cylinder" id="btn-cylinder">
              <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/></svg>
              Cylinder
            </button>
            <button class="toggle-btn" data-geo="cuboid" id="btn-cuboid">
              <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
              Cuboid
            </button>
          </div>

          <!-- Variable toggle -->
          <div class="toggle-group" id="variable-toggle">
            <button class="var-btn active" data-var="temperature">θ₀ Temp</button>
            <button class="var-btn" data-var="salinity">S₀ Salinity</button>
            <button class="var-btn" data-var="currents">Velocity</button>
          </div>

          <!-- Reset camera -->
          <button class="icon-btn" id="btn-reset" title="Reset Camera">
            <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          </button>
        </div>
      </div>

      <!-- Bottom Orbit Hint -->
      <div id="orbit-hint">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49"/></svg>
        <span>Drag to orbit • Scroll to zoom • Right-click to pan</span>
      </div>
    </div>

    <!-- Collapse trigger (shown when panel is hidden) -->
    <button id="collapse-trigger">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      <span>Show Telemetry Data (<span id="trigger-depth">0</span>m)</span>
    </button>

    <!-- Side Data Panel -->
    <div id="side-panel">
      <!-- Header -->
      <div class="panel-header">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
            <span class="ml-badge">ML Telemetry</span>
            <span class="basin">Arabian Sea</span>
          </div>
          <h3>Water Column Intelligence</h3>
          <div class="coords">15.4000°N, 71.2000°E</div>
        </div>
        <div class="header-actions">
          <button class="header-btn" id="btn-minimize" title="Minimize panel">
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>

      <!-- Sub-navigation Tabs -->
      <div class="panel-tabs">
        <button class="tab-btn active" data-tab="telemetry">All Predictions</button>
        <button class="tab-btn" data-tab="layers">Layer Slices (<span id="layer-count">14</span>)</button>
        <button class="tab-btn" data-tab="profile">Profiles (T-z / S-z)</button>
      </div>

      <!-- Scrollable Body -->
      <div class="panel-body" id="panel-body">
        <!-- Content injected by JS -->
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

    // ─── Mock Oceanographic Data ─────────────────────────────────────────────────
    const WATER_COLUMN = [
      { depth: 0,    thetao: 28.50, so: 35.20, uo:  0.120, vo: -0.080, current_speed: 0.144, chlorophyll: 0.520 },
      { depth: 30,   thetao: 27.80, so: 35.18, uo:  0.100, vo: -0.065, current_speed: 0.119, chlorophyll: 0.480 },
      { depth: 50,   thetao: 26.20, so: 35.15, uo:  0.085, vo: -0.050, current_speed: 0.099, chlorophyll: 0.410 },
      { depth: 75,   thetao: 23.10, so: 35.10, uo:  0.070, vo: -0.042, current_speed: 0.082, chlorophyll: 0.320 },
      { depth: 100,  thetao: 20.50, so: 35.05, uo:  0.058, vo: -0.035, current_speed: 0.068, chlorophyll: 0.250 },
      { depth: 150,  thetao: 16.80, so: 35.02, uo:  0.045, vo: -0.028, current_speed: 0.053, chlorophyll: 0.150 },
      { depth: 200,  thetao: 13.40, so: 34.98, uo:  0.035, vo: -0.022, current_speed: 0.041, chlorophyll: 0.080 },
      { depth: 300,  thetao: 10.20, so: 34.92, uo:  0.025, vo: -0.015, current_speed: 0.029, chlorophyll: 0.035 },
      { depth: 500,  thetao: 7.50,  so: 34.85, uo:  0.018, vo: -0.010, current_speed: 0.021, chlorophyll: 0.012 },
      { depth: 750,  thetao: 5.20,  so: 34.78, uo:  0.012, vo: -0.007, current_speed: 0.014, chlorophyll: 0.005 },
      { depth: 1000, thetao: 3.80,  so: 34.72, uo:  0.008, vo: -0.005, current_speed: 0.009, chlorophyll: 0.002 },
      { depth: 1500, thetao: 2.60,  so: 34.68, uo:  0.005, vo: -0.003, current_speed: 0.006, chlorophyll: 0.001 },
      { depth: 2000, thetao: 1.80,  so: 34.65, uo:  0.003, vo: -0.002, current_speed: 0.004, chlorophyll: 0.001 },
    ];

    const DERIVED_METRICS = {
      thermocline_depth: 85,
      mixed_layer_depth: 42,
      pycnocline_strength: 3.42,
      mean_column_speed: 0.053,
    };

    const MODEL_META = { model_name: 'Lahar-XGBoost', model_version: '2.1' };

    // ─── State ───────────────────────────────────────────────────────────────────
    let selectedDepthIndex = 0;
    let activeTab = 'telemetry';
    let geometryType = 'cylinder'; // 'cylinder' | 'cuboid'
    let activeVariable = 'temperature'; // 'temperature' | 'salinity' | 'currents'
    let panelCollapsed = false;

    function getActiveLayer() { return WATER_COLUMN[selectedDepthIndex]; }
    function getZoneLabel(d) {
      if (d === 0) return 'Surface Photic Zone';
      if (d <= 50) return 'Epipelagic Mixed Layer';
      if (d <= 200) return 'Thermocline Transition';
      if (d <= 1000) return 'Mesopelagic Twilight';
      return 'Bathypelagic Abyss';
    }

    // ─── Side Panel Rendering ────────────────────────────────────────────────────
    function renderPanel() {
      const body = document.getElementById('panel-body');
      const layer = getActiveLayer();
      const dirDeg = ((Math.atan2(layer.uo, layer.vo) * 180 / Math.PI) + 360) % 360;
      const dirStr = dirDeg >= 337.5 || dirDeg < 22.5 ? 'N' :
        dirDeg < 67.5 ? 'NE' : dirDeg < 112.5 ? 'E' : dirDeg < 157.5 ? 'SE' :
        dirDeg < 202.5 ? 'S' : dirDeg < 247.5 ? 'SW' : dirDeg < 292.5 ? 'W' : 'NW';

      if (activeTab === 'telemetry') {
        body.innerHTML = `
          <!-- Depth Selector -->
          <div class="depth-selector fade-in">
            <div class="ds-header">
              <div class="ds-label">
                <svg viewBox="0 0 24 24"><path d="M4 21V14M4 10V3M12 21V12M12 8V3M20 21V16M20 12V3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
                Depth Slice Selector
              </div>
              <div class="ds-badge">${layer.depth === 0 ? '0m (Surface)' : layer.depth + ' meters'}</div>
            </div>
            <div class="zone-label">Zone: <span>${getZoneLabel(layer.depth)}</span></div>
            <input type="range" class="ds-slider" id="depth-slider-panel" min="0" max="${WATER_COLUMN.length - 1}" step="1" value="${selectedDepthIndex}" />
            <div class="ds-ticks">
              ${['0m', '100m', '500m', '1000m', '2000m'].map((t, i) => {
                const targets = [0, 100, 500, 1000, 2000];
                const idx = WATER_COLUMN.findIndex(w => w.depth >= targets[i]);
                return `<span data-idx="${idx >= 0 ? idx : WATER_COLUMN.length - 1}" class="${selectedDepthIndex === (idx >= 0 ? idx : WATER_COLUMN.length - 1) ? 'active' : ''}">${t}</span>`;
              }).join('')}
            </div>
            <div class="ds-presets">
              ${[
                { label: 'Surface (0m)', depth: 0 },
                { label: 'Thermocline (100m)', depth: 100 },
                { label: 'Mid (500m)', depth: 500 },
                { label: 'Abyss (2000m)', depth: 2000 },
              ].map(p => {
                const idx = WATER_COLUMN.findIndex(w => Math.abs(w.depth - p.depth) < 25);
                return `<button class="preset-btn ${selectedDepthIndex === idx ? 'active' : ''}" data-idx="${idx}">${p.label}</button>`;
              }).join('')}
            </div>
          </div>

          <!-- Primary Metrics Grid -->
          <div class="metrics-grid fade-in">
            <div class="metric-card mc-temp">
              <div class="mc-label">
                <svg viewBox="0 0 24 24"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>
                Potential Temp (θ₀)
              </div>
              <div class="mc-value">${layer.thetao.toFixed(2)}<span class="unit">°C</span></div>
              <div class="mc-sub">${layer.depth === 0 ? 'Surface Photic Layer' : layer.depth <= 200 ? 'Thermocline Gradient' : 'Deep Cold Layer'}</div>
            </div>

            <div class="metric-card mc-sal">
              <div class="mc-label">
                <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                Salinity (S₀)
              </div>
              <div class="mc-value">${layer.so.toFixed(2)}<span class="unit">PSU</span></div>
              <div class="mc-sub">Practical Salinity Scale</div>
            </div>

            <div class="metric-card mc-vel">
              <div class="mc-label">
                <svg viewBox="0 0 24 24"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>
                Current Velocity
              </div>
              <div class="mc-value">${layer.current_speed.toFixed(3)}<span class="unit">m/s</span></div>
              <div class="mc-sub">≈ ${(layer.current_speed * 1.94384).toFixed(2)} knots</div>
            </div>

            <div class="metric-card mc-dir">
              <div class="mc-label">
                <svg viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
                Current Heading
              </div>
              <div class="mc-value">${Math.round(dirDeg)}°<span class="unit">${dirStr}</span></div>
              <div class="mc-sub">Flow vector bearing</div>
            </div>
          </div>

          <!-- Velocity Components -->
          <div class="velocity-card fade-in">
            <div class="vc-title">Horizontal Velocity Components (u₀, v₀)</div>
            <div class="vc-row">
              <div class="vc-cell">
                <div class="vc-label">Eastward (u₀)</div>
                <div class="vc-val ${layer.uo >= 0 ? 'pos' : 'neg'}">${layer.uo >= 0 ? '+' : ''}${layer.uo.toFixed(3)} m/s</div>
              </div>
              <div class="vc-cell">
                <div class="vc-label">Northward (v₀)</div>
                <div class="vc-val ${layer.vo >= 0 ? 'pos' : 'neg'}">${layer.vo >= 0 ? '+' : ''}${layer.vo.toFixed(3)} m/s</div>
              </div>
            </div>
          </div>

          <!-- Chlorophyll -->
          <div class="chl-card fade-in">
            <div class="mc-label" style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:10px;font-weight:700;text-transform:uppercase;color:#81c784;">
              <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:#81c784;stroke-width:2;"><path d="M7 20h10M10 20c5.5-2.5.8-6.4 3-10 .1-2 1.7-4 3.5-5.5A5 5 0 0 0 12 6a5 5 0 0 0-4.5-1.5C9.3 6 11 8 11.1 10c2.2 3.6-2.5 7.5 3 10"/></svg>
              Chlorophyll-a Concentration
            </div>
            <div class="mc-value" style="font-size:22px;font-weight:800;color:#fff;">${layer.chlorophyll.toFixed(3)}<span class="unit" style="color:#a5d6a7;">mg/m³</span></div>
            <div class="mc-sub">${layer.chlorophyll > 1.0 ? 'High productivity (bloom likely)' : layer.chlorophyll > 0.3 ? 'Moderate productivity' : layer.chlorophyll > 0.1 ? 'Oligotrophic waters' : 'Deep depleted zone'}</div>
          </div>

          <!-- Stratification Metrics -->
          <div class="strat-card fade-in">
            <div class="sc-title">
              <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
              Water Column Stratification Metrics
            </div>
            <div class="strat-grid">
              <div class="strat-item">
                <div class="si-label">Thermocline Core</div>
                <div class="si-value" style="color:var(--cyan);">${DERIVED_METRICS.thermocline_depth} m</div>
              </div>
              <div class="strat-item">
                <div class="si-label">Mixed Layer Depth</div>
                <div class="si-value" style="color:var(--green);">${DERIVED_METRICS.mixed_layer_depth} m</div>
              </div>
              <div class="strat-item">
                <div class="si-label">Pycnocline Gradient</div>
                <div class="si-value" style="color:#ffd166;">${DERIVED_METRICS.pycnocline_strength} <span style="font-size:9px;">×10⁻² °C/m</span></div>
              </div>
              <div class="strat-item">
                <div class="si-label">Column Mean Speed</div>
                <div class="si-value" style="color:var(--purple);">${DERIVED_METRICS.mean_column_speed.toFixed(3)} m/s</div>
              </div>
            </div>
          </div>

          <!-- Model Card -->
          <div class="model-card fade-in">
            <div class="md-title">
              <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>
              ${MODEL_META.model_name} (v${MODEL_META.model_version})
            </div>
            <div class="r2-grid">
              <div class="r2-item"><div class="r2-label">R² (θ₀)</div><div class="r2-val" style="color:var(--green);">0.9978</div></div>
              <div class="r2-item"><div class="r2-label">R² (S₀)</div><div class="r2-val" style="color:var(--green);">0.9868</div></div>
              <div class="r2-item"><div class="r2-label">R² (u₀)</div><div class="r2-val" style="color:var(--cyan);">0.7628</div></div>
              <div class="r2-item"><div class="r2-label">R² (v₀)</div><div class="r2-val" style="color:var(--cyan);">0.6560</div></div>
            </div>
          </div>
        `;
      } else if (activeTab === 'layers') {
        body.innerHTML = `
          <div class="layers-list fade-in">
            <div class="layers-hint">Click any depth level to inspect in 3D scene:</div>
            ${WATER_COLUMN.map((l, i) => `
              <div class="layer-row ${selectedDepthIndex === i ? 'selected' : ''}" data-layer="${i}">
                <div class="layer-left">
                  <div class="layer-depth">${l.depth}m</div>
                  <div class="layer-vals">
                    <span>${l.thetao.toFixed(1)}°C</span>
                    <span>${l.so.toFixed(1)} PSU</span>
                  </div>
                </div>
                <div class="layer-speed">${l.current_speed.toFixed(3)} m/s</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (activeTab === 'profile') {
        // Build SVG paths from water column data
        const wc = WATER_COLUMN;
        const maxD = wc[wc.length - 1].depth;
        const tempPath = wc.map((l, i) => {
          const x = 40 + (Math.max(0, Math.min(32, l.thetao)) / 32) * 270;
          const y = 20 + Math.pow(l.depth / maxD, 0.6) * 165;
          return `${i === 0 ? 'M' : 'L'} ${x} ${y}`;
        }).join(' ');
        const salPath = wc.map((l, i) => {
          const x = 40 + ((Math.max(33, Math.min(37, l.so)) - 33) / 4) * 270;
          const y = 20 + Math.pow(l.depth / maxD, 0.6) * 165;
          return `${i === 0 ? 'M' : 'L'} ${x} ${y}`;
        }).join(' ');

        body.innerHTML = `
          <div class="fade-in">
            <div class="profile-title">Vertical Temperature & Salinity Decay Profile</div>
            <div class="profile-chart">
              <svg viewBox="0 0 340 210">
                <line x1="40" y1="20" x2="40" y2="185" stroke="#335577" stroke-width="1"/>
                <line x1="40" y1="20" x2="320" y2="20" stroke="#335577" stroke-width="1"/>
                <line x1="40" y1="185" x2="320" y2="185" stroke="#335577" stroke-width="1"/>
                <text x="34" y="24" fill="#7aa0c4" font-size="9" text-anchor="end">0m</text>
                <text x="34" y="65" fill="#7aa0c4" font-size="9" text-anchor="end">200m</text>
                <text x="34" y="105" fill="#7aa0c4" font-size="9" text-anchor="end">500m</text>
                <text x="34" y="145" fill="#7aa0c4" font-size="9" text-anchor="end">1000m</text>
                <text x="34" y="185" fill="#7aa0c4" font-size="9" text-anchor="end">2000m</text>
                <path d="${tempPath}" fill="none" stroke="#ff7733" stroke-width="2.5"/>
                <path d="${salPath}" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="4 3"/>
              </svg>
            </div>
            <div class="profile-legend">
              <div class="leg-item"><div class="leg-color" style="background:#ff7733;"></div><span style="color:#ff9966;">θ₀ Temperature (°C)</span></div>
              <div class="leg-item"><div class="leg-color" style="background:#00e5ff;border-bottom:1px dashed #00e5ff;"></div><span style="color:#00e5ff;">S₀ Salinity (PSU)</span></div>
            </div>
          </div>
        `;
      }

      // Bind events
      bindPanelEvents();
    }

    function bindPanelEvents() {
      // Depth slider
      const slider = document.getElementById('depth-slider-panel');
      if (slider) {
        slider.addEventListener('input', e => {
          selectedDepthIndex = parseInt(e.target.value);
          renderPanel();
          update3DHighlight();
        });
      }

      // Tick marks
      document.querySelectorAll('.ds-ticks span').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.idx);
          if (!isNaN(idx)) { selectedDepthIndex = idx; renderPanel(); update3DHighlight(); }
        });
      });

      // Preset buttons
      document.querySelectorAll('.preset-btn').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.idx);
          if (!isNaN(idx) && idx >= 0) { selectedDepthIndex = idx; renderPanel(); update3DHighlight(); }
        });
      });

      // Layer rows
      document.querySelectorAll('.layer-row').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.layer);
          if (!isNaN(idx)) { selectedDepthIndex = idx; renderPanel(); update3DHighlight(); }
        });
      });
    }

    // ─── Tabs, Geometry, Variable toggles ────────────────────────────────────────
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        renderPanel();
      });
    });

    document.getElementById('btn-cylinder').addEventListener('click', () => {
      geometryType = 'cylinder';
      document.getElementById('btn-cylinder').classList.add('active');
      document.getElementById('btn-cuboid').classList.remove('active');
      rebuild3D();
    });
    document.getElementById('btn-cuboid').addEventListener('click', () => {
      geometryType = 'cuboid';
      document.getElementById('btn-cuboid').classList.add('active');
      document.getElementById('btn-cylinder').classList.remove('active');
      rebuild3D();
    });

    document.querySelectorAll('.var-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.var-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeVariable = btn.dataset.var;
        rebuild3D();
      });
    });

    // Minimize/expand
    document.getElementById('btn-minimize').addEventListener('click', () => {
      panelCollapsed = true;
      document.getElementById('side-panel').style.transform = 'translateX(100%)';
      document.getElementById('collapse-trigger').classList.add('visible');
      document.getElementById('top-controls').classList.add('side-collapsed');
      setTimeout(() => {
        document.getElementById('side-panel').style.width = '0';
        onResize();
      }, 450);
    });
    document.getElementById('collapse-trigger').addEventListener('click', () => {
      panelCollapsed = false;
      document.getElementById('side-panel').style.width = '380px';
      document.getElementById('side-panel').style.transform = 'translateX(0)';
      document.getElementById('collapse-trigger').classList.remove('visible');
      document.getElementById('top-controls').classList.remove('side-collapsed');
      setTimeout(onResize, 50);
    });

    // ─── Three.js Setup ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('three-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
    camera.position.set(5.2, 3.8, 6.4);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(-1.0, 0, 0);
    controls.minDistance = 2.5;
    controls.maxDistance = 18;
    controls.maxPolarAngle = Math.PI / 2 + 0.25;

    // Lighting
    scene.add(new THREE.AmbientLight(0x90caf9, 0.8));
    const dirLight1 = new THREE.DirectionalLight(0xe0f7fa, 1.4);
    dirLight1.position.set(10, 15, 8);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0x0055ff, 0.5);
    dirLight2.position.set(-10, -5, -8);
    scene.add(dirLight2);
    const pointLight = new THREE.PointLight(0x00e5ff, 1.2, 8);
    scene.add(pointLight);

    const BLOCK_HEIGHT = 6.2;
    const BLOCK_RADIUS = 1.6;
    const BLOCK_WIDTH = 3.0;

    // Container group
    const waterGroup = new THREE.Group();
    waterGroup.position.set(-1.0, 0, 0);
    scene.add(waterGroup);

    // ─── Color mapping ───────────────────────────────────────────────────────────
    function getLayerColor(val, variable, normalizedDepth) {
      if (variable === 'salinity') {
        const t = Math.max(0, Math.min(1, (val - 34.2) / 2.0));
        return new THREE.Color().lerpColors(new THREE.Color('#00e5ff'), new THREE.Color('#ffaa00'), t);
      }
      if (variable === 'currents') {
        const t = Math.max(0, Math.min(1, val / 0.25));
        return new THREE.Color().lerpColors(new THREE.Color('#0088ff'), new THREE.Color('#00f5a0'), t);
      }
      const t = Math.max(0, Math.min(1, (val - 2.0) / 28.0));
      const deepCold = new THREE.Color('#002244');
      const thermocline = new THREE.Color('#0088ff');
      const surfaceWarm = new THREE.Color('#00f0ff');
      const surfaceHot = new THREE.Color('#ff7700');
      if (t < 0.3) return new THREE.Color().lerpColors(deepCold, thermocline, t / 0.3);
      else if (t < 0.75) return new THREE.Color().lerpColors(thermocline, surfaceWarm, (t - 0.3) / 0.45);
      else return new THREE.Color().lerpColors(surfaceWarm, surfaceHot, (t - 0.75) / 0.25);
    }

    // ─── Build 3D scene ──────────────────────────────────────────────────────────
    let layerGroups = [];

    function rebuild3D() {
      // Clear
      while (waterGroup.children.length) waterGroup.remove(waterGroup.children[0]);
      layerGroups = [];

      const maxDepth = WATER_COLUMN[WATER_COLUMN.length - 1].depth || 2000;

      // Outer translucent block
      const outerGeo = geometryType === 'cylinder'
        ? new THREE.CylinderGeometry(BLOCK_RADIUS, BLOCK_RADIUS, BLOCK_HEIGHT, 48, 24, false)
        : new THREE.BoxGeometry(BLOCK_WIDTH, BLOCK_HEIGHT, BLOCK_WIDTH, 16, 24, 16);
      const outerMat = new THREE.MeshPhysicalMaterial({
        color: 0x0066aa,
        emissive: 0x002b4d,
        emissiveIntensity: 0.25,
        transmission: 0.65,
        opacity: 0.78,
        transparent: true,
        roughness: 0.08,
        metalness: 0.04,
        ior: 1.333,
        reflectivity: 0.5,
        clearcoat: 0.3,
        clearcoatRoughness: 0.1,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
      const outerMesh = new THREE.Mesh(outerGeo, outerMat);
      waterGroup.add(outerMesh);

      // Surface cap
      const capGeo = geometryType === 'cylinder'
        ? new THREE.CircleGeometry(BLOCK_RADIUS - 0.02, 48)
        : new THREE.PlaneGeometry(BLOCK_WIDTH - 0.04, BLOCK_WIDTH - 0.04);
      const capMat = new THREE.MeshStandardMaterial({
        color: 0x00ffff, emissive: 0x00bfff, emissiveIntensity: 0.6,
        roughness: 0.15, transparent: true, opacity: 0.88,
      });
      const capMesh = new THREE.Mesh(capGeo, capMat);
      capMesh.position.set(0, BLOCK_HEIGHT / 2 + 0.01, 0);
      capMesh.rotation.x = -Math.PI / 2;
      waterGroup.add(capMesh);

      // Layer slices
      WATER_COLUMN.forEach((layer, idx) => {
        const ratio = layer.depth / maxDepth;
        const y = BLOCK_HEIGHT / 2 - ratio * BLOCK_HEIGHT;
        const val = activeVariable === 'salinity' ? layer.so :
                    activeVariable === 'currents' ? layer.current_speed : layer.thetao;
        const color = getLayerColor(val, activeVariable, ratio);
        const isHighlight = selectedDepthIndex === idx;

        const grp = new THREE.Group();
        grp.position.set(0, y, 0);

        // Disc
        const discGeo = geometryType === 'cylinder'
          ? new THREE.CircleGeometry(BLOCK_RADIUS * 0.96, 36)
          : new THREE.PlaneGeometry(BLOCK_WIDTH * 0.96, BLOCK_WIDTH * 0.96);
        const discMat = new THREE.MeshStandardMaterial({
          color, emissive: color,
          emissiveIntensity: isHighlight ? 0.85 : 0.3,
          transparent: true,
          opacity: isHighlight ? 0.85 : 0.42,
          depthWrite: false,
        });
        const disc = new THREE.Mesh(discGeo, discMat);
        disc.rotation.x = -Math.PI / 2;
        grp.add(disc);

        // Rim ring
        if (geometryType === 'cylinder') {
          const ringGeo = new THREE.RingGeometry(BLOCK_RADIUS * 0.95, BLOCK_RADIUS * 0.99, 36);
          const ringMat = new THREE.MeshBasicMaterial({
            color, transparent: true, opacity: isHighlight ? 0.95 : 0.55,
          });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.rotation.x = -Math.PI / 2;
          grp.add(ring);
        } else {
          const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(BLOCK_WIDTH * 0.98, 0.02, BLOCK_WIDTH * 0.98));
          const edgeMat = new THREE.LineBasicMaterial({
            color, transparent: true, opacity: isHighlight ? 0.95 : 0.5,
          });
          grp.add(new THREE.LineSegments(edgeGeo, edgeMat));
        }

        // Current arrow
        const arrowLength = Math.max(0.3, Math.min(1.2, layer.current_speed * 5.0));
        const angle = Math.atan2(layer.vo, layer.uo);
        const arrowGrp = new THREE.Group();
        arrowGrp.rotation.y = -angle;
        arrowGrp.position.y = 0.04;

        const shaftGeo = new THREE.CylinderGeometry(0.025, 0.025, arrowLength, 8);
        const shaftMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
        const shaft = new THREE.Mesh(shaftGeo, shaftMat);
        shaft.position.set(arrowLength / 2, 0, 0);
        shaft.rotation.z = Math.PI / 2;
        arrowGrp.add(shaft);

        const coneGeo = new THREE.ConeGeometry(0.08, 0.22, 10);
        const coneMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const cone = new THREE.Mesh(coneGeo, coneMat);
        cone.position.set(arrowLength, 0, 0);
        cone.rotation.z = -Math.PI / 2;
        arrowGrp.add(cone);

        grp.add(arrowGrp);

        // Store references for highlight updates
        grp.userData = { discMat, idx };
        layerGroups.push(grp);
        waterGroup.add(grp);
      });

      // Seabed base
      const baseGeo = geometryType === 'cylinder'
        ? new THREE.CircleGeometry(BLOCK_RADIUS + 0.05, 36)
        : new THREE.PlaneGeometry(BLOCK_WIDTH + 0.1, BLOCK_WIDTH + 0.1);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0x001830, roughness: 0.9, metalness: 0.2 });
      const baseMesh = new THREE.Mesh(baseGeo, baseMat);
      baseMesh.position.set(0, -BLOCK_HEIGHT / 2 - 0.02, 0);
      baseMesh.rotation.x = Math.PI / 2;
      waterGroup.add(baseMesh);

      // Depth axis ruler
      buildDepthRuler(maxDepth);
    }

    function buildDepthRuler(maxDepth) {
      const rulerGrp = new THREE.Group();
      rulerGrp.position.set(-2.4, 0, 0);

      // Vertical line
      const spineGeo = new THREE.CylinderGeometry(0.02, 0.02, BLOCK_HEIGHT, 8);
      const spineMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4 });
      rulerGrp.add(new THREE.Mesh(spineGeo, spineMat));

      const ticks = [0, 100, 500, 1000, 2000];
      ticks.forEach(d => {
        const ratio = d / maxDepth;
        const y = BLOCK_HEIGHT / 2 - ratio * BLOCK_HEIGHT;

        // Tick line
        const tickGeo = new THREE.BoxGeometry(0.3, 0.02, 0.02);
        const tickMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
        const tick = new THREE.Mesh(tickGeo, tickMat);
        tick.position.set(0.15, y, 0);
        rulerGrp.add(tick);

        // Label as sprite
        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 128; labelCanvas.height = 48;
        const ctx = labelCanvas.getContext('2d');
        ctx.fillStyle = '#e0f7fa';
        ctx.font = 'bold 28px Inter, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`-${d}m`, 120, 34);
        const tex = new THREE.CanvasTexture(labelCanvas);
        const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.position.set(-0.5, y, 0);
        sprite.scale.set(0.8, 0.3, 1);
        rulerGrp.add(sprite);
      });

      // Depth labels on the right side of the cylinder
      WATER_COLUMN.forEach((layer, idx) => {
        const ratio = layer.depth / maxDepth;
        const y = BLOCK_HEIGHT / 2 - ratio * BLOCK_HEIGHT;

        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 128; labelCanvas.height = 48;
        const ctx = labelCanvas.getContext('2d');
        ctx.fillStyle = selectedDepthIndex === idx ? '#00f5a0' : '#88c0d0';
        ctx.font = `bold 26px Inter, sans-serif`;
        ctx.textAlign = 'left';
        ctx.fillText(`${Math.round(layer.depth)}m`, 4, 34);
        const tex = new THREE.CanvasTexture(labelCanvas);
        const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
        const sprite = new THREE.Sprite(spriteMat);
        const xOff = geometryType === 'cylinder' ? BLOCK_RADIUS + 0.45 : BLOCK_WIDTH / 2 + 0.45;
        sprite.position.set(xOff, y, 0);
        sprite.scale.set(0.7, 0.26, 1);
        sprite.userData.isDepthLabel = true;
        sprite.userData.layerIdx = idx;
        waterGroup.add(sprite);
      });

      waterGroup.add(rulerGrp);
    }

    function update3DHighlight() {
      layerGroups.forEach(grp => {
        const { discMat, idx } = grp.userData;
        const isHighlight = selectedDepthIndex === idx;
        discMat.emissiveIntensity = isHighlight ? 0.85 : 0.3;
        discMat.opacity = isHighlight ? 0.85 : 0.42;
      });

      // Update depth labels color
      waterGroup.children.forEach(child => {
        if (child.isSprite && child.userData.isDepthLabel) {
          // Rebuild label with new color
          const idx = child.userData.layerIdx;
          const isHighlight = selectedDepthIndex === idx;
          const labelCanvas = document.createElement('canvas');
          labelCanvas.width = 128; labelCanvas.height = 48;
          const ctx = labelCanvas.getContext('2d');
          ctx.fillStyle = isHighlight ? '#00f5a0' : '#88c0d0';
          ctx.font = `bold 26px Inter, sans-serif`;
          ctx.textAlign = 'left';
          ctx.fillText(`${WATER_COLUMN[idx].depth}m`, 4, 34);
          child.material.map = new THREE.CanvasTexture(labelCanvas);
          child.material.needsUpdate = true;
        }
      });

      // Update trigger depth
      document.getElementById('trigger-depth').textContent = getActiveLayer().depth;
    }

    // Reset button
    document.getElementById('btn-reset').addEventListener('click', () => {
      controls.target.set(panelCollapsed ? 0 : -1.0, 0, 0);
      camera.position.set(5.2, 3.8, 6.4);
      controls.update();
    });

    // Resize handler
    function onResize() {
      const area = document.getElementById('canvas-area');
      const w = area.clientWidth;
      const h = area.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', onResize);

    // Animation loop
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.016;
      controls.update();

      // Subtle bob for the internal layers
      layerGroups.forEach(grp => {
        grp.position.y += Math.sin(time * 0.8) * 0.0002;
      });

      renderer.render(scene, camera);
    }

    // ─── Init ────────────────────────────────────────────────────────────────────
    onResize();
    rebuild3D();
    renderPanel();
    animate();

    // Update layer count in tab
    document.getElementById('layer-count').textContent = WATER_COLUMN.length;
  </script>
</body>
</html>
