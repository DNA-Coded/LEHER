# SamudraX Dataset Catalog
# Defines all available oceanographic datasets and their properties

datasets:

  temperature:
    provider: copernicus
    dataset_id: "global-analysis-forecast-phy-001-024"
    format: zarr
    variable: thetao
    dimensions:
      - time
      - depth
      - latitude
      - longitude
    unit: degC
    description: "Sea water temperature"

  salinity:
    provider: copernicus
    dataset_id: "global-analysis-forecast-phy-001-024"
    format: zarr
    variable: so
    dimensions:
      - time
      - depth
      - latitude
      - longitude
    unit: PSU
    description: "Sea water salinity"

  currents:
    provider: copernicus
    dataset_id: "global-analysis-forecast-phy-001-024"
    format: zarr
    variables:
      - uo  # eastward sea water velocity
      - vo  # northward sea water velocity
    dimensions:
      - time
      - depth
      - latitude
      - longitude
    unit: m/s
    description: "Ocean currents (U and V components)"

  bathymetry:
    provider: gebco
    dataset: GEBCO_2023
    format: netcdf
    variable: elevation
    dimensions:
      - latitude
      - longitude
    unit: meters
    description: "Global bathymetry (seafloor elevation)"

  chlorophyll:
    provider: copernicus
    dataset_id: "global-analysis-forecast-bio-001-028"
    format: zarr
    variable: chl
    dimensions:
      - time
      - depth
      - latitude
      - longitude
    unit: mg/m³
    description: "Chlorophyll-a concentration"

  sea_level:
    provider: copernicus
    dataset_id: "global-analysis-forecast-phy-001-024"
    format: zarr
    variable: sla
    dimensions:
      - time
      - latitude
      - longitude
    unit: meters
    description: "Sea level anomaly"

  argo_observations:
    provider: argo
    format: json
    dimensions:
      - time
      - depth
      - latitude
      - longitude
    unit: varies
    description: "Argo float profiling observations"