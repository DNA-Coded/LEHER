<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEHER — 3D Volumetric Depth Slice</title>
  <meta name="description" content="Standalone 3D Volumetric Ocean Depth Slice Viewer with telemetry data panel" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #010a18;
      --bg-panel: rgba(3, 14, 28, 0.94);
      --cyan: #00e5ff;
      --cyan-dim: #7aa0c4;
      --green: #00f5a0;
      --orange: #ff7a36;
      --purple: #c084fc;
      --white: #e2f1ff;
      --border-cyan: rgba(0, 220, 255, 0.3);
      --border-dim: rgba(255, 255, 255, 0.08);
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Consolas', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg-primary);
      font-family: var(--font-sans);
      color: var(--white);
    }

    #app {
      width: 100vw; height: 100vh;
      display: flex;
      position: relative;
      background: radial-gradient(ellipse at 50% 30%, #031c38 0%, #010a18 70%, #00040a 100%);
    }

    /* ── 3D Canvas Area ──────────────────────────────────────────────── */
    #canvas-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #three-canvas {
      width: 100%; height: 100%;
      display: block;
    }

    /* ── Top Controls Bar ────────────────────────────────────────────── */
    #top-controls {
      position: absolute;
      top: 16px; left: 16px; right: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 10;
      pointer-events: none;
      transition: right 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #top-controls.side-collapsed { right: 16px; }

    .ctrl-glass {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(5, 18, 38, 0.88);
      backdrop-filter: blur(16px);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-cyan);
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }

    .title-icon {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #00d2ff, #0055ff);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 14px rgba(0, 210, 255, 0.5);
      flex-shrink: 0;
    }
    .title-icon svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .title-text h2 {
      font-size: 13px; font-weight: 700; color: #fff;
      letter-spacing: 0.5px;
      display: flex; align-items: center; gap: 8px;
    }
    .badge {
      font-size: 8.5px; font-weight: 800; text-transform: uppercase;
      padding: 2px 7px; border-radius: 4px;
      background: rgba(0, 245, 160, 0.18); color: var(--green);
      border: 1px solid rgba(0, 245, 160, 0.4);
      letter-spacing: 0.5px;
    }
    .title-sub {
      font-size: 11px; color: var(--cyan-dim); font-family: var(--font-mono);
      margin-top: 1px;
    }

    /* Toggle group */
    .toggle-group {
      display: flex;
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      padding: 2px;
    }
    .toggle-btn {
      padding: 6px 11px; border-radius: 6px; border: none;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; font-family: var(--font-sans);
      background: transparent; color: var(--cyan-dim);
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: linear-gradient(135deg, #00d2ff, #0088ff);
      color: #fff;
    }
    .toggle-btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .var-btn {
      padding: 6px 10px; border-radius: 6px; border: none;
      cursor: pointer; font-size: 11px; font-weight: 600; font-family: var(--font-sans);
      background: transparent; color: var(--cyan-dim); transition: all 0.2s;
    }
    .var-btn.active {
      background: rgba(0, 229, 255, 0.25); color: var(--cyan);
    }

    .icon-btn {
      width: 32px; height: 32px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05); color: var(--white);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .icon-btn:hover { background: rgba(0, 210, 255, 0.2); }
    .icon-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── Floating Color Scale Legend Widget ───────────────────────────── */
    #color-legend-widget {
      position: absolute; bottom: 58px; left: 20px;
      display: flex; flex-direction: column; gap: 6px;
      padding: 10px 14px; border-radius: 12px;
      background: rgba(3, 14, 28, 0.92); backdrop-filter: blur(16px);
      border: 1px solid var(--border-cyan);
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      width: 250px; z-index: 10;
      font-family: var(--font-mono);
      pointer-events: auto;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .legend-title-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 10.5px; font-weight: 700; color: #fff;
    }
    .legend-val-badge {
      font-size: 11px; font-weight: 800; color: var(--cyan);
      display: flex; align-items: center; gap: 6px;
    }
    .legend-val-dot {
      width: 9px; height: 9px; border-radius: 50%; display: inline-block;
      transition: background-color 0.25s;
    }
    .legend-bar-track {
      position: relative; width: 100%; height: 10px; border-radius: 5px;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.18);
      overflow: visible;
    }
    #legend-bar-gradient {
      width: 100%; height: 100%; border-radius: 4px;
      transition: background 0.3s;
    }
    #legend-needle {
      position: absolute; top: -3px; width: 4px; height: 16px;
      background: #ffffff; border-radius: 2px;
      box-shadow: 0 0 8px #ffffff, 0 0 2px #000;
      transform: translateX(-50%);
      transition: left 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .legend-ticks-row {
      display: flex; justify-content: space-between;
      font-size: 9px; color: var(--cyan-dim);
    }

    /* ── Bottom helper pill ───────────────────────────────────────────── */
    #orbit-hint {
      position: absolute; bottom: 20px; left: 20px;
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 20px;
      background: rgba(2, 11, 24, 0.75); backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 220, 255, 0.2);
      color: var(--cyan-dim); font-size: 11px;
      pointer-events: none;
    }
    #orbit-hint svg { width: 13px; height: 13px; fill: none; stroke: #00d2ff; stroke-width: 2; }

    /* ── Depth Slider Bottom Bar ──────────────────────────────────────── */
    #depth-bar {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-60%);
      display: flex; align-items: center; gap: 14px;
      background: rgba(3, 14, 28, 0.92); backdrop-filter: blur(16px);
      border: 1px solid var(--border-cyan); border-radius: 14px;
      padding: 8px 18px; z-index: 10;
    }
    #depth-bar .depth-label {
      font-size: 12px; color: var(--cyan); font-weight: 600;
      white-space: nowrap;
    }
    #depth-bar .depth-label span { color: #fff; font-weight: 700; }
    #depth-bar input[type="range"] {
      width: 180px; height: 5px;
      -webkit-appearance: none; appearance: none;
      background: linear-gradient(90deg, #00f0ff 0%, #0077ff 50%, #001f4d 100%);
      border-radius: 3px; outline: none; cursor: pointer;
    }
    #depth-bar input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: #00e5ff;
      border: 2px solid #fff; box-shadow: 0 0 8px rgba(0,229,255,0.6);
      cursor: grab;
    }
    #depth-bar .tick-marks {
      display: flex; gap: 12px; font-size: 10px;
      color: #6088aa; font-family: var(--font-mono);
    }
    #depth-bar .tick-marks span { cursor: pointer; transition: color 0.15s; }
    #depth-bar .tick-marks span:hover { color: var(--green); }
    #depth-bar .tick-marks span.active { color: var(--green); font-weight: 700; }

    /* ── Side Data Panel ─────────────────────────────────────────────── */
    #side-panel {
      width: 380px; max-width: 380px;
      height: 100vh;
      background: var(--bg-panel);
      backdrop-filter: blur(24px);
      border-left: 1px solid var(--border-cyan);
      display: flex; flex-direction: column;
      box-shadow: -16px 0 50px rgba(0,0,0,0.5), 0 0 25px rgba(0,180,255,0.08);
      z-index: 20; overflow: hidden;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #side-panel.collapsed { transform: translateX(100%); width: 0; min-width: 0; }

    /* Collapse trigger */
    #collapse-trigger {
      position: absolute; top: 80px; right: 16px; z-index: 30;
      display: none; align-items: center; gap: 8px;
      background: rgba(3, 14, 28, 0.92); backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 220, 255, 0.4); border-radius: 24px;
      padding: 8px 16px; color: var(--cyan); font-size: 12px; font-weight: 700;
      cursor: pointer; box-shadow: 0 8px 30px rgba(0,0,0,0.7), 0 0 16px rgba(0,220,255,0.25);
      transition: all 0.2s;
    }
    #collapse-trigger:hover { background: rgba(0, 40, 80, 0.95); transform: scale(1.03); }
    #collapse-trigger.visible { display: flex; }
    #collapse-trigger svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

    /* Panel header */
    .panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(0, 220, 255, 0.15);
      background: linear-gradient(180deg, rgba(0, 220, 255, 0.08) 0%, transparent 100%);
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .panel-header .ml-badge {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1px; padding: 2px 7px; border-radius: 5px;
      background: rgba(0, 229, 255, 0.18); color: var(--cyan);
      border: 1px solid rgba(0, 229, 255, 0.35);
    }
    .panel-header .basin { font-size: 12px; color: var(--cyan-dim); font-weight: 600; margin-left: 8px; }
    .panel-header h3 { margin: 4px 0 0; font-size: 17px; font-weight: 700; color: #fff; }
    .panel-header .coords { font-size: 11px; color: #00d2ff; font-family: var(--font-mono); margin-top: 2px; }

    .header-actions { display: flex; align-items: center; gap: 6px; }
    .header-btn {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      color: #80d8ff; cursor: pointer; transition: all 0.2s;
    }
    .header-btn:hover { background: rgba(0, 210, 255, 0.25); }
    .header-btn.close:hover { background: rgba(255, 60, 60, 0.35); color: #fff; }
    .header-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Panel tabs */
    .panel-tabs {
      display: flex; padding: 6px 14px; gap: 6px;
      background: rgba(0,0,0,0.25);
      border-bottom: 1px solid rgba(0, 220, 255, 0.1);
    }
    .tab-btn {
      flex: 1; padding: 6px 0; font-size: 11px; font-weight: 700;
      border-radius: 6px; border: none; cursor: pointer;
      background: transparent; color: var(--cyan-dim);
      font-family: var(--font-sans); transition: all 0.2s;
    }
    .tab-btn.active { background: rgba(0, 229, 255, 0.2); color: var(--cyan); }

    /* Panel body */
    .panel-body {
      flex: 1; overflow-y: auto; padding: 14px 18px;
      scrollbar-width: thin; scrollbar-color: rgba(0,229,255,0.2) transparent;
    }
    .panel-body::-webkit-scrollbar { width: 5px; }
    .panel-body::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.2); border-radius: 3px; }
    .panel-body::-webkit-scrollbar-track { background: transparent; }

    /* ── Depth Selector Card ─────────────────────────────────────────── */
    .depth-selector {
      background: linear-gradient(135deg, rgba(0,25,55,0.75) 0%, rgba(0,15,35,0.85) 100%);
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 12px; padding: 12px 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      margin-bottom: 14px;
    }
    .depth-selector .ds-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .ds-header .ds-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 700; color: var(--white);
    }
    .ds-header .ds-label svg { width: 14px; height: 14px; fill: none; stroke: var(--cyan); stroke-width: 2; }
    .ds-badge {
      background: rgba(0, 245, 160, 0.15); border: 1px solid rgba(0, 245, 160, 0.4);
      padding: 2px 9px; border-radius: 8px;
      font-size: 13px; font-weight: 800; color: var(--green);
      font-family: var(--font-mono);
    }
    .zone-label { font-size: 11px; color: var(--cyan-dim); margin-bottom: 10px; }
    .zone-label span { color: var(--cyan); font-weight: 600; }

    .ds-slider {
      width: 100%; height: 6px; border-radius: 3px; outline: none; cursor: pointer;
      -webkit-appearance: none; appearance: none;
      background: linear-gradient(90deg, #00f0ff 0%, #0077ff 50%, #001f4d 100%);
      margin: 6px 0 10px;
    }
    .ds-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--cyan);
      border: 2px solid #fff; box-shadow: 0 0 8px rgba(0,229,255,0.5);
    }
    .ds-ticks {
      display: flex; justify-content: space-between;
      font-size: 10px; color: #6088aa; font-family: var(--font-mono);
      padding: 0 2px;
    }
    .ds-ticks span { cursor: pointer; transition: color 0.15s; }
    .ds-ticks span:hover { color: var(--green); }
    .ds-ticks span.active { color: var(--green); }

    .ds-presets {
      display: flex; gap: 5px; margin-top: 10px;
    }
    .preset-btn {
      flex: 1; padding: 4px 2px; border-radius: 6px;
      font-size: 9px; font-weight: 700; font-family: var(--font-sans);
      border: 1px solid var(--border-dim);
      background: rgba(255,255,255,0.04); color: #88aacc;
      cursor: pointer; transition: all 0.15s;
    }
    .preset-btn.active {
      border-color: var(--green); background: rgba(0, 245, 160, 0.18);
      color: var(--green);
    }

    /* ── Metric Cards Grid ───────────────────────────────────────────── */
    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 14px; }

    .metric-card {
      background: rgba(0, 30, 60, 0.5);
      border-radius: 10px; padding: 11px;
    }
    .metric-card .mc-label {
      display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
    }
    .metric-card .mc-label svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
    .metric-card .mc-value {
      font-size: 22px; font-weight: 800; color: #fff;
    }
    .metric-card .mc-value .unit { font-size: 12px; font-weight: 500; margin-left: 4px; }
    .metric-card .mc-sub { font-size: 10px; color: var(--cyan-dim); margin-top: 2px; }

    .mc-temp { border: 1px solid rgba(255, 120, 60, 0.3); }
    .mc-temp .mc-label { color: #ff9d6b; }
    .mc-temp .mc-value .unit { color: #ffaa77; }

    .mc-sal { border: 1px solid rgba(0, 229, 255, 0.3); }
    .mc-sal .mc-label { color: var(--cyan); }
    .mc-sal .mc-value .unit { color: #88e0ff; }

    .mc-vel { border: 1px solid rgba(0, 245, 160, 0.3); }
    .mc-vel .mc-label { color: var(--green); }
    .mc-vel .mc-value .unit { color: #70ffcc; }

    .mc-dir { border: 1px solid rgba(160, 100, 255, 0.3); }
    .mc-dir .mc-label { color: var(--purple); }
    .mc-dir .mc-value .unit { color: var(--purple); }

    /* ── Velocity Components Card ────────────────────────────────────── */
    .velocity-card {
      background: rgba(0, 20, 45, 0.5);
      border: 1px solid rgba(0, 220, 255, 0.18);
      border-radius: 10px; padding: 11px 13px; margin-bottom: 14px;
    }
    .vc-title { font-size: 11px; font-weight: 700; color: #8ec5fc; margin-bottom: 8px; }
    .vc-row { display: flex; justify-content: space-between; gap: 10px; }
    .vc-cell {
      flex: 1; background: rgba(0,0,0,0.3); padding: 7px; border-radius: 6px;
    }
    .vc-cell .vc-label { font-size: 10px; color: var(--cyan-dim); }
    .vc-cell .vc-val { font-size: 14px; font-weight: 700; margin-top: 2px; }
    .vc-cell .vc-val.pos { color: var(--green); }
    .vc-cell .vc-val.neg { color: #ff7a7a; }

    /* ── Chlorophyll Card ─────────────────────────────────────────────── */
    .chl-card {
      background: rgba(0, 35, 20, 0.5);
      border: 1px solid rgba(76, 175, 80, 0.3);
      border-radius: 10px; padding: 11px 13px; margin-bottom: 14px;
    }
    .chl-card .mc-label { color: #81c784; }
    .chl-card .mc-value .unit { color: #a5d6a7; }

    /* ── Stratification Metrics Card ─────────────────────────────────── */
    .strat-card {
      background: rgba(0, 25, 55, 0.6);
      border: 1px solid rgba(0, 220, 255, 0.25);
      border-radius: 12px; padding: 12px; margin-bottom: 14px;
    }
    .strat-card .sc-title {
      display: flex; align-items: center; gap: 7px; margin-bottom: 8px;
      font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 0.4px;
    }
    .strat-card .sc-title svg { width: 14px; height: 14px; fill: none; stroke: var(--cyan); stroke-width: 2; }
    .strat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .strat-item {
      background: rgba(0,0,0,0.25); padding: 7px 9px; border-radius: 8px;
    }
    .strat-item .si-label { font-size: 10px; color: var(--cyan-dim); }
    .strat-item .si-value { font-size: 15px; font-weight: 700; margin-top: 2px; }

    /* ── Model Provenance Card ───────────────────────────────────────── */
    .model-card {
      background: rgba(0, 15, 35, 0.5);
      border: 1px solid var(--border-dim);
      border-radius: 10px; padding: 10px 12px; margin-bottom: 14px;
    }
    .model-card .md-title {
      display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
      font-size: 11px; font-weight: 700; color: var(--green);
    }
    .model-card .md-title svg { width: 13px; height: 13px; fill: none; stroke: var(--green); stroke-width: 2; }
    .r2-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; text-align: center; }
    .r2-item { background: rgba(255,255,255,0.03); padding: 5px 2px; border-radius: 6px; }
    .r2-item .r2-label { font-size: 9px; color: var(--cyan-dim); }
    .r2-item .r2-val { font-size: 11px; font-weight: 700; margin-top: 1px; }

    /* ── Layers Tab ──────────────────────────────────────────────────── */
    .layers-list { display: flex; flex-direction: column; gap: 7px; }
    .layers-hint { font-size: 11px; color: var(--cyan-dim); margin-bottom: 4px; }
    .layer-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 11px; border-radius: 8px;
      background: rgba(0, 20, 40, 0.4); border: 1px solid var(--border-dim);
      cursor: pointer; transition: all 0.15s;
    }
    .layer-row:hover { background: rgba(0, 60, 100, 0.3); }
    .layer-row.selected {
      background: rgba(0, 229, 255, 0.2); border-color: var(--cyan);
    }
    .layer-left { display: flex; align-items: center; gap: 9px; }
    .layer-depth {
      width: 36px; height: 22px; border-radius: 4px;
      background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: #8ec5fc;
    }
    .layer-row.selected .layer-depth { color: var(--green); }
    .layer-vals span:first-child { font-size: 12px; font-weight: 700; color: #fff; }
    .layer-vals span:last-child { font-size: 10px; color: var(--cyan-dim); margin-left: 7px; }
    .layer-speed { font-size: 11px; font-family: var(--font-mono); color: var(--green); }

    /* ── Profile Tab ─────────────────────────────────────────────────── */
    .profile-title { font-size: 12px; font-weight: 700; color: #fff; margin-bottom: 10px; }
    .profile-chart {
      width: 100%; height: 240px;
      background: rgba(0, 10, 25, 0.6); border-radius: 10px;
      border: 1px solid rgba(0, 220, 255, 0.2); padding: 10px;
    }
    .profile-chart svg { width: 100%; height: 100%; }

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

    // ─── Mock Oceanographic Data ─────────────────────────────────────────────────
    const WATER_COLUMN = [
      { depth: 0,    thetao: 28.50, so: 35.20, uo:  0.120, vo: -0.080, current_speed: 0.144, chlorophyll: 0.520 },

      { depth: 100,  thetao: 20.50, so: 35.05, uo:  0.058, vo: -0.035, current_speed: 0.068, chlorophyll: 0.250 },

      { depth: 500,  thetao: 7.50,  so: 34.85, uo:  0.018, vo: -0.010, current_speed: 0.021, chlorophyll: 0.012 },
      { depth: 750,  thetao: 5.20,  so: 34.78, uo:  0.012, vo: -0.007, current_speed: 0.014, chlorophyll: 0.005 },
      { depth: 1000, thetao: 3.80,  so: 34.72, uo:  0.008, vo: -0.005, current_speed: 0.009, chlorophyll: 0.002 },
      { depth: 1500, thetao: 2.60,  so: 34.68, uo:  0.005, vo: -0.003, current_speed: 0.006, chlorophyll: 0.001 },
      { depth: 2000, thetao: 1.80,  so: 34.65, uo:  0.003, vo: -0.002, current_speed: 0.004, chlorophyll: 0.001 },
    ];

    const DERIVED_METRICS = {
      thermocline_depth: 85,
      mixed_layer_depth: 42,
      pycnocline_strength: 3.42,
      mean_column_speed: 0.053,
    };

    const MODEL_META = { model_name: 'Lahar-XGBoost', model_version: '2.1' };

    // ─── Query Params & State ──────────────────────────────────────────────────
    const urlParams = new URLSearchParams(window.location.search);
    const queryLat = parseFloat(urlParams.get('lat')) || 15.4;
    const queryLon = parseFloat(urlParams.get('lon')) || 71.2;
    const queryDepth = parseInt(urlParams.get('depth'), 10);

    let selectedDepthIndex = 0;
    if (!isNaN(queryDepth)) {
      const idx = WATER_COLUMN.findIndex(w => Math.abs(w.depth - queryDepth) < 25);
      if (idx >= 0) selectedDepthIndex = idx;
    }

    let activeTab = 'telemetry';
    let geometryType = 'cylinder'; // 'cylinder' | 'cuboid'
    let activeVariable = 'temperature'; // 'temperature' | 'salinity' | 'currents' | 'chlorophyll'
    let panelCollapsed = false;

    function getActiveLayer() { return WATER_COLUMN[selectedDepthIndex]; }
    function getZoneLabel(d) {
      if (d === 0) return 'Surface Photic Zone';
      if (d <= 50) return 'Epipelagic Mixed Layer';
      if (d <= 200) return 'Thermocline Transition';
      if (d <= 1000) return 'Mesopelagic Twilight';
      return 'Bathypelagic Abyss';
    }

    // ─── Side Panel Rendering ────────────────────────────────────────────────────
    function renderPanel() {
      const body = document.getElementById('panel-body');
      const layer = getActiveLayer();
      const dirDeg = ((Math.atan2(layer.uo, layer.vo) * 180 / Math.PI) + 360) % 360;
      const dirStr = dirDeg >= 337.5 || dirDeg < 22.5 ? 'N' :
        dirDeg < 67.5 ? 'NE' : dirDeg < 112.5 ? 'E' : dirDeg < 157.5 ? 'SE' :
        dirDeg < 202.5 ? 'S' : dirDeg < 247.5 ? 'SW' : dirDeg < 292.5 ? 'W' : 'NW';

      if (activeTab === 'telemetry') {
        body.innerHTML = `
          <!-- Depth Selector -->
          <div class="depth-selector fade-in">
            <div class="ds-header">
              <div class="ds-label">
                <svg viewBox="0 0 24 24"><path d="M4 21V14M4 10V3M12 21V12M12 8V3M20 21V16M20 12V3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
                Depth Slice Selector
              </div>
              <div class="ds-badge">${layer.depth === 0 ? '0m (Surface)' : layer.depth + ' meters'}</div>
            </div>
            <div class="zone-label">Zone: <span>${getZoneLabel(layer.depth)}</span></div>
            <input type="range" class="ds-slider" id="depth-slider-panel" min="0" max="${WATER_COLUMN.length - 1}" step="1" value="${selectedDepthIndex}" />
            <div class="ds-ticks">
              ${['0m', '100m', '500m', '1000m', '2000m'].map((t, i) => {
                const targets = [0, 100, 500, 1000, 2000];
                const idx = WATER_COLUMN.findIndex(w => w.depth >= targets[i]);
                return `<span data-idx="${idx >= 0 ? idx : WATER_COLUMN.length - 1}" class="${selectedDepthIndex === (idx >= 0 ? idx : WATER_COLUMN.length - 1) ? 'active' : ''}">${t}</span>`;
              }).join('')}
            </div>
            <div class="ds-presets">
              ${[
                { label: 'Surface (0m)', depth: 0 },
                { label: 'Thermocline (100m)', depth: 100 },
                { label: 'Mid (500m)', depth: 500 },
                { label: 'Abyss (2000m)', depth: 2000 },
              ].map(p => {
                const idx = WATER_COLUMN.findIndex(w => Math.abs(w.depth - p.depth) < 25);
                return `<button class="preset-btn ${selectedDepthIndex === idx ? 'active' : ''}" data-idx="${idx}">${p.label}</button>`;
              }).join('')}
            </div>
          </div>

          <!-- Primary Metrics Grid -->
          <div class="metrics-grid fade-in">
            <div class="metric-card mc-temp">
              <div class="mc-label">
                <svg viewBox="0 0 24 24"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>
                Potential Temp (θ₀)
              </div>
              <div class="mc-value">${layer.thetao.toFixed(2)}<span class="unit">°C</span></div>
              <div class="mc-sub">${layer.depth === 0 ? 'Surface Photic Layer' : layer.depth <= 200 ? 'Thermocline Gradient' : 'Deep Cold Layer'}</div>
            </div>

            <div class="metric-card mc-sal">
              <div class="mc-label">
                <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                Salinity (S₀)
              </div>
              <div class="mc-value">${layer.so.toFixed(2)}<span class="unit">PSU</span></div>
              <div class="mc-sub">Practical Salinity Scale</div>
            </div>

            <div class="metric-card mc-vel">
              <div class="mc-label">
                <svg viewBox="0 0 24 24"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>
                Current Velocity
              </div>
              <div class="mc-value">${layer.current_speed.toFixed(3)}<span class="unit">m/s</span></div>
              <div class="mc-sub">≈ ${(layer.current_speed * 1.94384).toFixed(2)} knots</div>
            </div>

            <div class="metric-card mc-dir">
              <div class="mc-label">
                <svg viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
                Current Heading
              </div>
              <div class="mc-value">${Math.round(dirDeg)}°<span class="unit">${dirStr}</span></div>
              <div class="mc-sub">Flow vector bearing</div>
            </div>
          </div>

          <!-- Velocity Components -->
          <div class="velocity-card fade-in">
            <div class="vc-title">Horizontal Velocity Components (u₀, v₀)</div>
            <div class="vc-row">
              <div class="vc-cell">
                <div class="vc-label">Eastward (u₀)</div>
                <div class="vc-val ${layer.uo >= 0 ? 'pos' : 'neg'}">${layer.uo >= 0 ? '+' : ''}${layer.uo.toFixed(3)} m/s</div>
              </div>
              <div class="vc-cell">
                <div class="vc-label">Northward (v₀)</div>
                <div class="vc-val ${layer.vo >= 0 ? 'pos' : 'neg'}">${layer.vo >= 0 ? '+' : ''}${layer.vo.toFixed(3)} m/s</div>
              </div>
            </div>
          </div>

          <!-- Chlorophyll -->
          <div class="chl-card fade-in">
            <div class="mc-label" style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:10px;font-weight:700;text-transform:uppercase;color:#81c784;">

              Chlorophyll-a Concentration
            </div>
            <div class="mc-value" style="font-size:22px;font-weight:800;color:#fff;">${layer.chlorophyll.toFixed(3)}<span class="unit" style="color:#a5d6a7;">mg/m³</span></div>

          <!-- Stratification Metrics -->

                <div class="si-value" style="color:var(--green);">${DERIVED_METRICS.mixed_layer_depth} m</div>
              </div>
              <div class="strat-item">
                <div class="si-label">Pycnocline Gradient</div>
                <div class="si-value" style="color:#ffd166;">${DERIVED_METRICS.pycnocline_strength} <span style="font-size:9px;">×10⁻² °C/m</span></div>
              </div>
              <div class="strat-item">
                <div class="si-label">Column Mean Speed</div>
                <div class="si-value" style="color:var(--purple);">${DERIVED_METRICS.mean_column_speed.toFixed(3)} m/s</div>
              </div>
            </div>
          </div>

          <!-- Model Card -->
          <div class="model-card fade-in">
            <div class="md-title">
              <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>
              ${MODEL_META.model_name} (v${MODEL_META.model_version})
            </div>
            <div class="r2-grid">
              <div class="r2-item"><div class="r2-label">R² (θ₀)</div><div class="r2-val" style="color:var(--green);">0.9978</div></div>
              <div class="r2-item"><div class="r2-label">R² (S₀)</div><div class="r2-val" style="color:var(--green);">0.9868</div></div>
              <div class="r2-item"><div class="r2-label">R² (u₀)</div><div class="r2-val" style="color:var(--cyan);">0.7628</div></div>
              <div class="r2-item"><div class="r2-label">R² (v₀)</div><div class="r2-val" style="color:var(--cyan);">0.6560</div></div>
            </div>
          </div>
        `;
      } else if (activeTab === 'layers') {
        body.innerHTML = `
          <div class="layers-list fade-in">
            <div class="layers-hint">Click any depth level to inspect in 3D scene:</div>
            ${WATER_COLUMN.map((l, i) => `
              <div class="layer-row ${selectedDepthIndex === i ? 'selected' : ''}" data-layer="${i}">
                <div class="layer-left">
                  <div class="layer-depth">${l.depth}m</div>
                  <div class="layer-vals">
                    <span>${l.thetao.toFixed(1)}°C</span>
                    <span>${l.so.toFixed(1)} PSU</span>
                  </div>
                </div>
                <div class="layer-speed">${l.current_speed.toFixed(3)} m/s</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (activeTab === 'profile') {
        // Build SVG paths from water column data
        const wc = WATER_COLUMN;
        const maxD = wc[wc.length - 1].depth;
        const tempPath = wc.map((l, i) => {
          const x = 40 + (Math.max(0, Math.min(32, l.thetao)) / 32) * 270;
          const y = 20 + Math.pow(l.depth / maxD, 0.6) * 165;
          return `${i === 0 ? 'M' : 'L'} ${x} ${y}`;
        }).join(' ');
        const salPath = wc.map((l, i) => {
          const x = 40 + ((Math.max(33, Math.min(37, l.so)) - 33) / 4) * 270;
          const y = 20 + Math.pow(l.depth / maxD, 0.6) * 165;
          return `${i === 0 ? 'M' : 'L'} ${x} ${y}`;
        }).join(' ');

        body.innerHTML = `
          <div class="fade-in">
            <div class="profile-title">Vertical Temperature & Salinity Decay Profile</div>
            <div class="profile-chart">
              <svg viewBox="0 0 340 210">

                <line x1="40" y1="185" x2="320" y2="185" stroke="#335577" stroke-width="1"/>
                <text x="34" y="24" fill="#7aa0c4" font-size="9" text-anchor="end">0m</text>
                <text x="34" y="65" fill="#7aa0c4" font-size="9" text-anchor="end">200m</text>
                <text x="34" y="105" fill="#7aa0c4" font-size="9" text-anchor="end">500m</text>
                <text x="34" y="145" fill="#7aa0c4" font-size="9" text-anchor="end">1000m</text>
                <text x="34" y="185" fill="#7aa0c4" font-size="9" text-anchor="end">2000m</text>
                <path d="${tempPath}" fill="none" stroke="#ff7733" stroke-width="2.5"/>
                <path d="${salPath}" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="4 3"/>
              </svg>
            </div>
            <div class="profile-legend">
              <div class="leg-item"><div class="leg-color" style="background:#ff7733;"></div><span style="color:#ff9966;">θ₀ Temperature (°C)</span></div>
              <div class="leg-item"><div class="leg-color" style="background:#00e5ff;border-bottom:1px dashed #00e5ff;"></div><span style="color:#00e5ff;">S₀ Salinity (PSU)</span></div>
            </div>
          </div>
        `;
      }

      // Bind events
      bindPanelEvents();
    }

      document.getElementById('collapse-trigger').classList.remove('visible');
      document.getElementById('top-controls').classList.remove('side-collapsed');
      setTimeout(onResize, 50);

    // ─── Wave state toggle event ────────────────────────────────────────────────
    let waveState = 'moderate';
    const waveAmplitudes = { calm: 0.45, moderate: 1.0, rough: 1.85 };
    const waveStates = ['calm', 'moderate', 'rough'];
    const waveLabels = {
      calm: 'Waves: Calm (0.3m)',
      moderate: 'Waves: Moderate (0.8m)',
      rough: 'Waves: Rough (1.6m)'
    };
    const waveBtn = document.getElementById('btn-wave-state');
    if (waveBtn) {
      waveBtn.addEventListener('click', () => {
        const curIdx = waveStates.indexOf(waveState);
        waveState = waveStates[(curIdx + 1) % waveStates.length];
        document.getElementById('wave-state-label').textContent = waveLabels[waveState];
      });
    }

    // ─── Three.js Setup ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('three-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
    camera.position.set(5.2, 3.8, 6.4);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(-1.0, 0, 0);
    controls.minDistance = 2.5;
    controls.maxDistance = 18;
    controls.maxPolarAngle = Math.PI / 2 + 0.25;

    // Lighting
    scene.add(new THREE.AmbientLight(0x90caf9, 0.85));
    const dirLight1 = new THREE.DirectionalLight(0xe0f7fa, 1.4);
    dirLight1.position.set(10, 15, 8);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0x0055ff, 0.6);
    dirLight2.position.set(-10, -5, -8);
    scene.add(dirLight2);

    // Underwater and caustic lights
    const pointLight = new THREE.PointLight(0x00e5ff, 1.3, 10);
    scene.add(pointLight);

    const sunCausticLight = new THREE.PointLight(0xd0f8ff, 2.0, 12);
    sunCausticLight.position.set(-1.0, 6.0, 1.0);
    scene.add(sunCausticLight);

    const BLOCK_HEIGHT = 6.2;
    const BLOCK_RADIUS = 1.6;
    const BLOCK_WIDTH = 3.0;

    // Container group
    const waterGroup = new THREE.Group();
    waterGroup.position.set(-1.0, 0, 0);
    scene.add(waterGroup);

    // ─── Scientifically Calibrated Multi-Stop Oceanographic Color Scales ──────
    // 1. Temperature: Red (35°C-28°C) -> Orange (28°C-22°C) -> Yellow/Lime (22°C-16°C) -> Cyan/Aqua (16°C-11°C) -> Deep Blue (11°C-5°C) -> Abyssal Indigo (1.5°C)
    const TEMP_STOPS = [
      [1.5,  '#090526'], // Extreme abyssal depth frigid void
      [3.5,  '#001a5e'], // Abyssal cold (2000m)
      [6.5,  '#0038a8'], // Deep cold layer (750m)
      [10.0, '#0066ee'], // Lower thermocline (300m)
      [14.0, '#00a8ff'], // Mid thermocline (200m)
      [18.0, '#00e5d4'], // Upper thermocline transition (100m)
      [22.0, '#76ff03'], // Mixed layer threshold (22°C) - electric lime
      [25.0, '#ffd000'], // Warm sub-surface (25°C) - bright golden yellow
      [28.0, '#ff7a00'], // Warm photic layer (28°C) - vivid ocean orange
      [31.0, '#ff2e1f'], // Hot tropical surface (31°C) - vibrant flame red
      [35.0, '#d60036'], // Scorching tropical basin (35°C) - intense crimson
    ];

    // 2. Salinity: Magenta/Coral (36.8-36.0 PSU) -> Amber/Gold (36.0-35.5) -> Emerald/Teal (35.5-34.8) -> Azure/Sapphire (34.8-34.0) -> Deep Marine (33.0)
    const SALINITY_STOPS = [
      [33.0, '#050a33'], // Fresh monsoonal plume / river runoff
      [34.2, '#003db3'], // Low salinity coastal
      [34.6, '#0088ff'], // Mild low salinity
      [35.0, '#00e5c0'], // Standard marine background
      [35.3, '#00f576'], // Typical Arabian Sea / open ocean emerald
      [35.7, '#bdf000'], // Elevated salinity (evaporative transition)
      [36.0, '#ffaa00'], // High salinity surface (warm amber-orange)
      [36.4, '#ff3b30'], // Very high salinity (coral red)
      [36.8, '#ff1a88'], // Hypersaline core (radiant magenta)
    ];

    // 3. Current Velocity: Dark Marine (0.002 m/s) -> Royal Blue (0.04) -> Electric Cyan (0.10) -> Seafoam Teal (0.16) -> Neon Spring Green (0.22) -> Electric Lime/Yellow (0.30+)
    const CURRENT_STOPS = [
      [0.002, '#0a0e29'], // Stagnant abyssal drift
      [0.015, '#122475'], // Sluggish deep current
      [0.040, '#0055d4'], // Gentle mid-depth drift
      [0.080, '#00b8ff'], // Moderate subsurface flow
      [0.130, '#00e5b8'], // Active upper layer current
      [0.180, '#00e676'], // Strong current flow (bright spring green)
      [0.240, '#76ff03'], // High-velocity surface jet (neon lime)
      [0.320, '#ffff00'], // Intense current jet core (electric yellow)
    ];

    // 4. Chlorophyll-a: Aphotic Midnight (0.001 mg/m³) -> Violet (0.04) -> Azure (0.15) -> Mint-Cyan (0.45) -> Bio-Emerald (0.85) -> Vivid Lime-Chartreuse (1.50+)
    const CHLOROPHYLL_STOPS = [
      [0.001, '#06081c'], // Deep aphotic depletion (2000m)
      [0.015, '#1e164d'], // Oligotrophic twilight zone (500m)
      [0.050, '#004c9e'], // Deep photic boundary (150m)
      [0.150, '#00a8ff'], // Lower euphotic layer (100m)
      [0.350, '#00e5bb'], // Moderate phytoplankton (75m)
      [0.600, '#00c853'], // Productive photic peak (surface-30m) - rich emerald
      [1.100, '#76ff03'], // Active phytoplankton bloom - neon lime
      [1.800, '#00ff55'], // High-density eutrophic bloom - intense green
    ];

    function interpolateColorRamp(value, stops) {
      if (value <= stops[0][0]) return new THREE.Color(stops[0][1]);
      if (value >= stops[stops.length - 1][0]) return new THREE.Color(stops[stops.length - 1][1]);

      for (let i = 0; i < stops.length - 1; i++) {
        const [v0, c0] = stops[i];
        const [v1, c1] = stops[i + 1];
        if (value >= v0 && value <= v1) {
          const t = (value - v0) / (v1 - v0);
          return new THREE.Color(c0).lerp(new THREE.Color(c1), t);
        }
      }
      return new THREE.Color(stops[stops.length - 1][1]);
    }

    function getLayerColor(val, variable) {
      if (variable === 'salinity') return interpolateColorRamp(val, SALINITY_STOPS);
      if (variable === 'currents') return interpolateColorRamp(val, CURRENT_STOPS);
      if (variable === 'chlorophyll') return interpolateColorRamp(val, CHLOROPHYLL_STOPS);
      return interpolateColorRamp(val, TEMP_STOPS);
    }

    // ─── Dynamic Color Scale Legend Widget Synchronization ────────────────────────
    function updateLegendWidget() {
      const layer = getActiveLayer();
      if (!layer) return;

      let title = 'θ₀ Temperature';
      let valStr = `${layer.thetao.toFixed(2)} °C`;
      let stops = TEMP_STOPS;
      let curVal = layer.thetao;
      let ticks = ['1.5°C', '12°C', '22°C', '35°C'];

      if (activeVariable === 'salinity') {
        title = 'S₀ Salinity';
        valStr = `${layer.so.toFixed(2)} PSU`;
        stops = SALINITY_STOPS;
        curVal = layer.so;
        ticks = ['33.0', '34.8', '35.7', '36.8 PSU'];
      } else if (activeVariable === 'currents') {
        title = 'Current Velocity';
        valStr = `${layer.current_speed.toFixed(3)} m/s`;
        stops = CURRENT_STOPS;
        curVal = layer.current_speed;
        ticks = ['0.00', '0.08', '0.18', '0.32 m/s'];
      } else if (activeVariable === 'chlorophyll') {
        title = '🌿 Chlorophyll-a';
        valStr = `${layer.chlorophyll.toFixed(3)} mg/m³`;
        stops = CHLOROPHYLL_STOPS;
        curVal = layer.chlorophyll;
        ticks = ['0.00', '0.15', '0.60', '1.80 mg/m³'];
      }

      const minV = stops[0][0];
      const maxV = stops[stops.length - 1][0];
      const pct = Math.max(0, Math.min(100, ((curVal - minV) / (maxV - minV)) * 100));

      const gradParts = stops.map(([v, c]) => {
        const p = ((v - minV) / (maxV - minV) * 100).toFixed(1);
        return `${c} ${p}%`;
      });
      const gradCss = `linear-gradient(to right, ${gradParts.join(', ')})`;

      const layerCol = getLayerColor(curVal, activeVariable);
      const hexCol = '#' + layerCol.getHexString();

      const titleEl = document.getElementById('legend-var-title');
      if (titleEl) titleEl.textContent = title;

      const valEl = document.getElementById('legend-val-text');
      if (valEl) valEl.textContent = valStr;

      const dotEl = document.getElementById('legend-dot');
      if (dotEl) dotEl.style.backgroundColor = hexCol;

      const barEl = document.getElementById('legend-bar-gradient');
      if (barEl) barEl.style.background = gradCss;

      const needleEl = document.getElementById('legend-needle');
      if (needleEl) needleEl.style.left = `${pct}%`;

      const ticksEl = document.getElementById('legend-ticks');
      if (ticksEl) {
        ticksEl.innerHTML = ticks.map(t => `<span>${t}</span>`).join('');
      }
    }

    // ─── Build 3D scene ──────────────────────────────────────────────────────────
    let layerGroups = [];
    let waveMesh = null;
    let meniscusMesh = null;
    let particlesMesh = null;
    let particleVelocities = [];

    function rebuild3D() {
      // Clear
      while (waterGroup.children.length) waterGroup.remove(waterGroup.children[0]);
      layerGroups = [];
      waveMesh = null;
      meniscusMesh = null;
      particlesMesh = null;
      particleVelocities = [];

      const maxDepth = WATER_COLUMN[WATER_COLUMN.length - 1].depth || 2000;

      // ── 1. Realistic Outer Translucent Seawater Column ──────────────────────
      const outerGeo = geometryType === 'cylinder'
        ? new THREE.CylinderGeometry(BLOCK_RADIUS, BLOCK_RADIUS, BLOCK_HEIGHT, 64, 32, false)
        : new THREE.BoxGeometry(BLOCK_WIDTH, BLOCK_HEIGHT, BLOCK_WIDTH, 24, 32, 24);
      
      const outerMat = new THREE.MeshPhysicalMaterial({
        color: 0x004c8c,
        emissive: 0x001428,
        emissiveIntensity: 0.28,
        transmission: 0.84,
        opacity: 0.82,
        transparent: true,
        roughness: 0.05,
        metalness: 0.03,
        ior: 1.333,
        reflectivity: 0.65,
        clearcoat: 0.8,
        clearcoatRoughness: 0.05,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
      const outerMesh = new THREE.Mesh(outerGeo, outerMat);
      waterGroup.add(outerMesh);

      // ── 2. Realistic 3D Dynamic Ocean Water Surface with Waves ──────────────
      // Tessellated high-density surface geometry to allow multi-frequency wave displacement
      const capGeo = geometryType === 'cylinder'
        ? new THREE.RingGeometry(0.001, BLOCK_RADIUS - 0.015, 64, 32)
        : new THREE.PlaneGeometry(BLOCK_WIDTH - 0.03, BLOCK_WIDTH - 0.03, 56, 56);

      // Cache resting vertex coordinates for mathematical wave calculations
      const vCount = capGeo.attributes.position.count;
      const origX = new Float32Array(vCount);
      const origY = new Float32Array(vCount);
      const posArr = capGeo.attributes.position.array;
      for (let i = 0; i < vCount; i++) {
        origX[i] = posArr[i * 3];
        origY[i] = posArr[i * 3 + 1];
      }
      capGeo.userData = { origX, origY };

      const surfaceVal = activeVariable === 'salinity' ? WATER_COLUMN[0].so :
                         activeVariable === 'currents' ? WATER_COLUMN[0].current_speed :
                         activeVariable === 'chlorophyll' ? WATER_COLUMN[0].chlorophyll :
                         WATER_COLUMN[0].thetao;
      const surfaceColor = getLayerColor(surfaceVal, activeVariable);

      const capMat = new THREE.MeshPhysicalMaterial({
        color: surfaceColor,
        emissive: surfaceColor,
        emissiveIntensity: 0.45,
        roughness: 0.08,
        metalness: 0.1,
        transmission: 0.62,
        transparent: true,
        opacity: 0.88,
        ior: 1.333,
        reflectivity: 0.85,
        clearcoat: 0.95,
        clearcoatRoughness: 0.06,
        side: THREE.DoubleSide,
        depthWrite: false,
      });

      waveMesh = new THREE.Mesh(capGeo, capMat);
      waveMesh.position.set(0, BLOCK_HEIGHT / 2 + 0.015, 0);
      waveMesh.rotation.x = -Math.PI / 2; // In this orientation, local Z points UP
      waterGroup.add(waveMesh);

      // Luminous Water Meniscus Ring at surface edge
      if (geometryType === 'cylinder') {
        const ringGeo = new THREE.RingGeometry(BLOCK_RADIUS - 0.04, BLOCK_RADIUS + 0.02, 64);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0x00f5a0,
          transparent: true,
          opacity: 0.6,
          side: THREE.DoubleSide
        });
        meniscusMesh = new THREE.Mesh(ringGeo, ringMat);
        meniscusMesh.position.set(0, BLOCK_HEIGHT / 2 + 0.02, 0);
        meniscusMesh.rotation.x = -Math.PI / 2;
        waterGroup.add(meniscusMesh);
      } else {
        const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(BLOCK_WIDTH * 0.99, 0.02, BLOCK_WIDTH * 0.99));
        const edgeMat = new THREE.LineBasicMaterial({ color: 0x00f5a0, transparent: true, opacity: 0.65 });
        meniscusMesh = new THREE.LineSegments(edgeGeo, edgeMat);
        meniscusMesh.position.set(0, BLOCK_HEIGHT / 2 + 0.01, 0);
        waterGroup.add(meniscusMesh);
      }

      // ── 3. Suspended Marine Snow & Plankton Particulates ────────────────────
      const pCount = 280;
      const pGeo = new THREE.BufferGeometry();
      const pPositions = new Float32Array(pCount * 3);
      const pColors = new Float32Array(pCount * 3);
      particleVelocities = [];

      for (let i = 0; i < pCount; i++) {
        const y = (Math.random() - 0.5) * (BLOCK_HEIGHT * 0.92);
        let x, z;
        if (geometryType === 'cylinder') {
          const r = Math.sqrt(Math.random()) * (BLOCK_RADIUS * 0.88);
          const theta = Math.random() * Math.PI * 2;
          x = Math.cos(theta) * r;
          z = Math.sin(theta) * r;
        } else {
          x = (Math.random() - 0.5) * (BLOCK_WIDTH * 0.88);
          z = (Math.random() - 0.5) * (BLOCK_WIDTH * 0.88);
        }
        pPositions[i * 3] = x;
        pPositions[i * 3 + 1] = y;
        pPositions[i * 3 + 2] = z;

        // Depth-based color: Surface particles are brighter greenish-cyan (phytoplankton)
        const depthRatio = (BLOCK_HEIGHT / 2 - y) / BLOCK_HEIGHT;
        if (depthRatio < 0.22) {
          pColors[i * 3] = 0.1;
          pColors[i * 3 + 1] = 0.95;
          pColors[i * 3 + 2] = 0.85;
        } else {
          pColors[i * 3] = 0.65;
          pColors[i * 3 + 1] = 0.85;
          pColors[i * 3 + 2] = 1.0;
        }

        // Current velocity decays with depth
        const currentDecay = Math.exp(-depthRatio * 3.2);
        particleVelocities.push({
          vx: (0.16 * currentDecay + (Math.random() - 0.5) * 0.03) * 0.007,
          vz: (-0.10 * currentDecay + (Math.random() - 0.5) * 0.03) * 0.007,
          bobFreq: 1.2 + Math.random() * 2.2,
          bobAmp: 0.001 + Math.random() * 0.0025,
        });
      }

      pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
      pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

      // Circular particle texture
      const canvasP = document.createElement('canvas');
      canvasP.width = 32; canvasP.height = 32;
      const ctxP = canvasP.getContext('2d');
      const gradP = ctxP.createRadialGradient(16, 16, 0, 16, 16, 16);
      gradP.addColorStop(0, 'rgba(255,255,255,1)');
      gradP.addColorStop(0.35, 'rgba(0,230,255,0.8)');
      gradP.addColorStop(1, 'rgba(0,50,150,0)');
      ctxP.fillStyle = gradP;
      ctxP.beginPath(); ctxP.arc(16, 16, 16, 0, Math.PI * 2); ctxP.fill();
      const pTex = new THREE.CanvasTexture(canvasP);

      const pMat = new THREE.PointsMaterial({
        size: 0.075,
        map: pTex,
        transparent: true,
        opacity: 0.78,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      particlesMesh = new THREE.Points(pGeo, pMat);
      waterGroup.add(particlesMesh);

      // ── 4. Layer Slices with Dynamic 3D Water Waves & Far Slide-out Extraction ──
      const SLIDE_FAR_X = 4.2;
      const SLIDE_FAR_Z = 1.25;
      const SLIDE_LIFT_Y = 0.28;

      WATER_COLUMN.forEach((layer, idx) => {
        const ratio = layer.depth / maxDepth;
        const y = BLOCK_HEIGHT / 2 - ratio * BLOCK_HEIGHT;
        const val = activeVariable === 'salinity' ? layer.so :
                    activeVariable === 'currents' ? layer.current_speed :
                    activeVariable === 'chlorophyll' ? layer.chlorophyll :
                    layer.thetao;
        const color = getLayerColor(val, activeVariable);
        const isHighlight = selectedDepthIndex === idx;

        const grp = new THREE.Group();
        grp.position.set(isHighlight ? SLIDE_FAR_X : 0, y + (isHighlight ? SLIDE_LIFT_Y : 0), isHighlight ? SLIDE_FAR_Z : 0);

        // A. 3D Volumetric Water Slab (Physical solid slice of water)
        const sliceThickness = 0.26;
        const slabGeo = geometryType === 'cylinder'
          ? new THREE.CylinderGeometry(BLOCK_RADIUS * 0.98, BLOCK_RADIUS * 0.98, sliceThickness, 48, 1, false)
          : new THREE.BoxGeometry(BLOCK_WIDTH * 0.98, sliceThickness, BLOCK_WIDTH * 0.98);

        const slabMat = new THREE.MeshPhysicalMaterial({
          color,
          emissive: color,
          emissiveIntensity: isHighlight ? 0.42 : 0.08,
          transmission: 0.78,
          transparent: true,
          opacity: isHighlight ? 0.94 : 0.22,
          roughness: 0.06,
          metalness: 0.04,
          ior: 1.333,
          clearcoat: 0.88,
          clearcoatRoughness: 0.06,
          side: THREE.DoubleSide,
          depthWrite: false,
        });
        const slabMesh = new THREE.Mesh(slabGeo, slabMat);
        grp.add(slabMesh);

        // B. Dynamic 3D Water Wave Surface on Top of the Slice
        const sliceWaveGeo = geometryType === 'cylinder'
          ? new THREE.RingGeometry(0.001, BLOCK_RADIUS * 0.97, 48, 22)
          : new THREE.PlaneGeometry(BLOCK_WIDTH * 0.97, BLOCK_WIDTH * 0.97, 40, 40);

        const sliceVCount = sliceWaveGeo.attributes.position.count;
        const sliceOrigX = new Float32Array(sliceVCount);
        const sliceOrigY = new Float32Array(sliceVCount);
        const sPosArr = sliceWaveGeo.attributes.position.array;
        for (let j = 0; j < sliceVCount; j++) {
          sliceOrigX[j] = sPosArr[j * 3];
          sliceOrigY[j] = sPosArr[j * 3 + 1];
        }
        sliceWaveGeo.userData = { origX: sliceOrigX, origY: sliceOrigY };

        const sliceWaveMat = new THREE.MeshPhysicalMaterial({
          color,
          emissive: color,
          emissiveIntensity: isHighlight ? 0.68 : 0.25,
          roughness: 0.08,
          metalness: 0.08,
          transmission: 0.65,
          transparent: true,
          opacity: isHighlight ? 0.94 : 0.42,
          ior: 1.333,
          reflectivity: 0.85,
          clearcoat: 0.95,
          clearcoatRoughness: 0.06,
          side: THREE.DoubleSide,
          depthWrite: false,
        });
        const sliceWaveMesh = new THREE.Mesh(sliceWaveGeo, sliceWaveMat);
        sliceWaveMesh.rotation.x = -Math.PI / 2;
        sliceWaveMesh.position.y = sliceThickness / 2 + 0.005;
        grp.add(sliceWaveMesh);

        // C. Glowing Water Rim Ring & Meniscus Edge
        if (geometryType === 'cylinder') {
          const ringGeo = new THREE.RingGeometry(BLOCK_RADIUS * 0.95, BLOCK_RADIUS * 0.99, 48);
          const ringMat = new THREE.MeshBasicMaterial({
            color, transparent: true, opacity: isHighlight ? 0.95 : 0.55,
          });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.rotation.x = -Math.PI / 2;
          ring.position.y = sliceThickness / 2 + 0.01;
          grp.add(ring);
        } else {
          const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(BLOCK_WIDTH * 0.98, 0.02, BLOCK_WIDTH * 0.98));
          const edgeMat = new THREE.LineBasicMaterial({
            color, transparent: true, opacity: isHighlight ? 0.95 : 0.5,
          });
          const edges = new THREE.LineSegments(edgeGeo, edgeMat);
          edges.position.y = sliceThickness / 2 + 0.01;
          grp.add(edges);
        }

        // D. Current Velocity 3D Arrow
        const arrowLength = Math.max(0.35, Math.min(1.3, layer.current_speed * 5.2));
        const angle = Math.atan2(layer.vo, layer.uo);
        const arrowGrp = new THREE.Group();
        arrowGrp.rotation.y = -angle;
        arrowGrp.position.y = sliceThickness / 2 + 0.04;

        const shaftGeo = new THREE.CylinderGeometry(0.025, 0.025, arrowLength, 8);
        const shaftMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
        const shaft = new THREE.Mesh(shaftGeo, shaftMat);
        shaft.position.set(arrowLength / 2, 0, 0);
        shaft.rotation.z = Math.PI / 2;
        arrowGrp.add(shaft);

        const coneGeo = new THREE.ConeGeometry(0.08, 0.22, 10);
        const coneMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const cone = new THREE.Mesh(coneGeo, coneMat);
        cone.position.set(arrowLength, 0, 0);
        cone.rotation.z = -Math.PI / 2;
        arrowGrp.add(cone);

        grp.add(arrowGrp);

        // Store state variables for physics-lerp slide animation & wave execution
        grp.userData = {
          sliceWaveMesh,
          slabMat,
          idx,
          baseY: y,
          curX: isHighlight ? SLIDE_FAR_X : 0,
          curZ: isHighlight ? SLIDE_FAR_Z : 0,
          curLift: isHighlight ? SLIDE_LIFT_Y : 0,
          targetX: isHighlight ? SLIDE_FAR_X : 0,
          targetZ: isHighlight ? SLIDE_FAR_Z : 0,
          targetLift: isHighlight ? SLIDE_LIFT_Y : 0,
          curScale: isHighlight ? 1.08 : 1.0,
          targetScale: isHighlight ? 1.08 : 1.0,
        };
        layerGroups.push(grp);
        waterGroup.add(grp);
      });

      // ── 5. Holographic Extraction Tether & Socket ───────────────────────────
      createExtractionTether();

      // ── 6. 3D Floating Holographic Info HUD Card ────────────────────────────
      createExtractedHud();

      // Seabed base
      const baseGeo = geometryType === 'cylinder'
        ? new THREE.CircleGeometry(BLOCK_RADIUS + 0.08, 48)
        : new THREE.PlaneGeometry(BLOCK_WIDTH + 0.15, BLOCK_WIDTH + 0.15);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0x001428, roughness: 0.92, metalness: 0.2 });
      const baseMesh = new THREE.Mesh(baseGeo, baseMat);
      baseMesh.position.set(0, -BLOCK_HEIGHT / 2 - 0.02, 0);
      baseMesh.rotation.x = Math.PI / 2;
      waterGroup.add(baseMesh);

      // Depth axis ruler
      buildDepthRuler(maxDepth);
    }

    // ─── Holographic Extraction Tether & Column Socket ─────────────────────────
    let tetherLine = null;
    let tetherPointerLine = null;
    let extractionSocket = null;

    function createExtractionTether() {
      // Guide rail line connecting column socket to extracted water slice
      const tetherGeo = new THREE.BufferGeometry();
      const positions = new Float32Array([0, 0, 0, 0, 0, 0]);
      tetherGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const tetherMat = new THREE.LineBasicMaterial({
        color: 0x00f5a0,
        transparent: true,
        opacity: 0,
      });
      tetherLine = new THREE.Line(tetherGeo, tetherMat);
      waterGroup.add(tetherLine);

      // Socket ring/box in main block showing extraction gap
      if (geometryType === 'cylinder') {
        const socketGeo = new THREE.RingGeometry(BLOCK_RADIUS * 0.96, BLOCK_RADIUS * 1.01, 48);
        const socketMat = new THREE.MeshBasicMaterial({
          color: 0x00e5ff,
          transparent: true,
          opacity: 0,
          side: THREE.DoubleSide
        });
        extractionSocket = new THREE.Mesh(socketGeo, socketMat);
        extractionSocket.rotation.x = -Math.PI / 2;
      } else {
        const socketGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(BLOCK_WIDTH * 0.99, 0.04, BLOCK_WIDTH * 0.99));
        const socketMat = new THREE.LineBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0 });
        extractionSocket = new THREE.LineSegments(socketGeo, socketMat);
      }
      waterGroup.add(extractionSocket);
    }

    // ─── 3D Floating Holographic HUD Info Card ────────────────────────────────
    let extractedHudSprite = null;
    let extractedHudCanvas = null;
    let extractedHudTexture = null;

    function createExtractedHud() {
      extractedHudCanvas = document.createElement('canvas');
      extractedHudCanvas.width = 512;
      extractedHudCanvas.height = 256;
      extractedHudTexture = new THREE.CanvasTexture(extractedHudCanvas);
      extractedHudTexture.minFilter = THREE.LinearFilter;

      const spriteMat = new THREE.SpriteMaterial({
        map: extractedHudTexture,
        transparent: true,
        opacity: 0,
        depthTest: false,
        depthWrite: false
      });
      extractedHudSprite = new THREE.Sprite(spriteMat);
      extractedHudSprite.scale.set(2.6, 1.3, 1);
      waterGroup.add(extractedHudSprite);

      updateExtractedHud(selectedDepthIndex);
    }

    function updateExtractedHud(idx) {
      if (!extractedHudCanvas || !extractedHudTexture) return;
      const layer = WATER_COLUMN[idx];
      if (!layer) return;

      const ctx = extractedHudCanvas.getContext('2d');
      const w = extractedHudCanvas.width;
      const h = extractedHudCanvas.height;

      ctx.clearRect(0, 0, w, h);

      // Cybernetic glass background
      ctx.fillStyle = 'rgba(2, 12, 28, 0.94)';
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.85)';
      ctx.lineWidth = 3;

      // Rounded container
      ctx.beginPath();
      ctx.roundRect(8, 8, w - 16, h - 16, 16);
      ctx.fill();
      ctx.stroke();

      // Top header banner
      ctx.fillStyle = 'rgba(0, 229, 255, 0.18)';
      ctx.fillRect(8, 8, w - 16, 44);

      // Sci-fi corner brackets
      ctx.strokeStyle = '#00f5a0';
      ctx.lineWidth = 4;
      // Top-left
      ctx.beginPath(); ctx.moveTo(8, 28); ctx.lineTo(8, 8); ctx.lineTo(28, 8); ctx.stroke();
      // Bottom-right
      ctx.beginPath(); ctx.moveTo(w - 28, h - 8); ctx.lineTo(w - 8, h - 8); ctx.lineTo(w - 8, h - 28); ctx.stroke();

      // Title & Extraction badge
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px "JetBrains Mono", monospace';
      ctx.fillText(`EXTRACTED SLICE: -${layer.depth}m`, 22, 38);

      ctx.fillStyle = '#00f5a0';
      ctx.font = 'bold 11px "JetBrains Mono", monospace';
      ctx.textAlign = 'right';
      ctx.fillText('LIVE TELEMETRY', w - 24, 36);
      ctx.textAlign = 'left';

      // Ocean Zone label
      ctx.fillStyle = '#7aa0c4';
      ctx.font = '500 14px Inter, sans-serif';
      ctx.fillText(getZoneLabel(layer.depth), 22, 74);

      // Separator line
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(22, 86); ctx.lineTo(w - 22, 86); ctx.stroke();

      // Telemetry metrics
      ctx.font = '600 16px "JetBrains Mono", monospace';

      // θ₀ Temperature
      if (activeVariable === 'temperature') {
        ctx.fillStyle = 'rgba(255, 122, 54, 0.22)';
        ctx.fillRect(16, 100, w - 32, 26);
      }
      ctx.fillStyle = '#ff7a36';
      ctx.fillText(`θ₀ Temp:`, 24, 118);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`${layer.thetao.toFixed(2)} °C`, 140, 118);

      // S₀ Salinity
      if (activeVariable === 'salinity') {
        ctx.fillStyle = 'rgba(0, 229, 255, 0.22)';
        ctx.fillRect(16, 132, w - 32, 26);
      }
      ctx.fillStyle = '#00e5ff';
      ctx.fillText(`S₀ Salinity:`, 24, 150);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`${layer.so.toFixed(2)} PSU`, 140, 150);

      // Current Velocity
      if (activeVariable === 'currents') {
        ctx.fillStyle = 'rgba(0, 245, 160, 0.22)';
        ctx.fillRect(16, 164, w - 32, 26);
      }
      ctx.fillStyle = '#00f5a0';
      ctx.fillText(`Current:`, 24, 182);
      ctx.fillStyle = '#ffffff';
      const heading = (Math.atan2(layer.vo, layer.uo) * 180 / Math.PI + 360) % 360;
      ctx.fillText(`${layer.current_speed.toFixed(3)} m/s (${Math.round(heading)}°)`, 140, 182);

      // Chlorophyll
      if (activeVariable === 'chlorophyll') {
        ctx.fillStyle = 'rgba(192, 132, 252, 0.22)';
        ctx.fillRect(16, 196, w - 32, 26);
      }
      ctx.fillStyle = '#c084fc';
      ctx.fillText(`Chl-a:`, 24, 214);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`${layer.chlorophyll.toFixed(3)} mg/m³`, 140, 214);

      extractedHudTexture.needsUpdate = true;
    }

    function buildDepthRuler(maxDepth) {
      const rulerGrp = new THREE.Group();
      const rulerX = geometryType === 'cylinder' ? -(BLOCK_RADIUS + 0.8) : -(BLOCK_WIDTH / 2 + 0.8);
      rulerGrp.position.set(rulerX, 0, 0);

      // Vertical line
      const spineGeo = new THREE.CylinderGeometry(0.02, 0.02, BLOCK_HEIGHT, 8);
      const spineMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4 });
      rulerGrp.add(new THREE.Mesh(spineGeo, spineMat));

      const ticks = [0, 100, 500, 1000, 2000];
      ticks.forEach(d => {
        const ratio = d / maxDepth;
        const y = BLOCK_HEIGHT / 2 - ratio * BLOCK_HEIGHT;

        // Tick line
        const tickGeo = new THREE.BoxGeometry(0.3, 0.02, 0.02);
        const tickMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
        const tick = new THREE.Mesh(tickGeo, tickMat);
        tick.position.set(0.15, y, 0);
        rulerGrp.add(tick);

        // Label as sprite
        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 128; labelCanvas.height = 48;
        const ctx = labelCanvas.getContext('2d');
        ctx.fillStyle = '#e0f7fa';
        ctx.font = 'bold 28px Inter, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`-${d}m`, 120, 34);
        const tex = new THREE.CanvasTexture(labelCanvas);
        const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.position.set(-0.5, y, 0);
        sprite.scale.set(0.8, 0.3, 1);
        rulerGrp.add(sprite);
      });

      // Depth labels on the right side of the cylinder
      WATER_COLUMN.forEach((layer, idx) => {
        const ratio = layer.depth / maxDepth;
        const y = BLOCK_HEIGHT / 2 - ratio * BLOCK_HEIGHT;

        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 128; labelCanvas.height = 48;
        const ctx = labelCanvas.getContext('2d');
        ctx.fillStyle = selectedDepthIndex === idx ? '#00f5a0' : '#88c0d0';
        ctx.font = `bold 26px Inter, sans-serif`;
        ctx.textAlign = 'left';
        ctx.fillText(`${Math.round(layer.depth)}m`, 4, 34);
        const tex = new THREE.CanvasTexture(labelCanvas);
        const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
        const sprite = new THREE.Sprite(spriteMat);
        const xOff = geometryType === 'cylinder' ? BLOCK_RADIUS + 0.45 : BLOCK_WIDTH / 2 + 0.45;
        sprite.position.set(xOff, y, 0);
        sprite.scale.set(0.7, 0.26, 1);
        sprite.userData.isDepthLabel = true;
        sprite.userData.layerIdx = idx;
        waterGroup.add(sprite);
      });

      waterGroup.add(rulerGrp);
    }

    function update3DHighlight() {
      const SLIDE_FAR_X = 4.2;
      const SLIDE_FAR_Z = 1.25;
      const SLIDE_LIFT_Y = 0.28;

      layerGroups.forEach(grp => {
        const { sliceWaveMesh, slabMat, idx } = grp.userData;
        const isHighlight = selectedDepthIndex === idx;

        // Slide target positions: Extracted slice slides out far forward-right!
        grp.userData.targetX = isHighlight ? SLIDE_FAR_X : 0;
        grp.userData.targetZ = isHighlight ? SLIDE_FAR_Z : 0;
        grp.userData.targetLift = isHighlight ? SLIDE_LIFT_Y : 0;
        grp.userData.targetScale = isHighlight ? 1.08 : 1.0;

        if (sliceWaveMesh) {
          sliceWaveMesh.material.emissiveIntensity = isHighlight ? 0.68 : 0.25;
          sliceWaveMesh.material.opacity = isHighlight ? 0.94 : 0.42;
        }

        if (slabMat) {
          slabMat.opacity = isHighlight ? 0.94 : 0.22;
          slabMat.emissiveIntensity = isHighlight ? 0.42 : 0.08;
        }
      });

      // Update 3D Floating HUD Card
      updateExtractedHud(selectedDepthIndex);

      // Update depth labels color
      waterGroup.children.forEach(child => {
        if (child.isSprite && child.userData.isDepthLabel) {
          const idx = child.userData.layerIdx;
          const isHighlight = selectedDepthIndex === idx;
          const labelCanvas = document.createElement('canvas');
          labelCanvas.width = 128; labelCanvas.height = 48;
          const ctx = labelCanvas.getContext('2d');
          ctx.fillStyle = isHighlight ? '#00f5a0' : '#88c0d0';
          ctx.font = `bold 26px Inter, sans-serif`;
          ctx.textAlign = 'left';
          ctx.fillText(`${WATER_COLUMN[idx].depth}m`, 4, 34);
          child.material.map = new THREE.CanvasTexture(labelCanvas);
          child.material.needsUpdate = true;
        }
      });

      // Update trigger depth and floating legend
      document.getElementById('trigger-depth').textContent = getActiveLayer().depth;
      updateLegendWidget();
    }

    // ─── 3D Raycasting: Click any depth slice in 3D to slide it out ────────────
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const testObjects = [];
      layerGroups.forEach(grp => {
        grp.traverse(child => {
          if (child.isMesh) {
            child.userData.parentIdx = grp.userData.idx;
            testObjects.push(child);
          }
        });
      });

      const hits = raycaster.intersectObjects(testObjects, false);
      if (hits.length > 0) {
        const hitIdx = hits[0].object.userData.parentIdx;
        if (typeof hitIdx === 'number' && hitIdx !== selectedDepthIndex) {
          selectedDepthIndex = hitIdx;
          renderPanel();
          update3DHighlight();
        }
      }
    });

    // Reset button
    document.getElementById('btn-reset').addEventListener('click', () => {
      controls.target.set(panelCollapsed ? 0 : -1.0, 0, 0);
      camera.position.set(5.2, 3.8, 6.4);
      controls.update();
    });

    // Resize handler
    function onResize() {
      const area = document.getElementById('canvas-area');
      const w = area.clientWidth;
      const h = area.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', onResize);

    // ─── Animation Loop with Real-time Wave, Current & Extraction Simulation ───
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.016;
      controls.update();

      const amp = waveAmplitudes[waveState] || 1.0;

      // 1. Dynamic Ocean Surface Waves Calculation (Main Column Top)
      if (waveMesh && waveMesh.geometry.userData.origX) {
        const posAttr = waveMesh.geometry.attributes.position;
        const origX = waveMesh.geometry.userData.origX;
        const origY = waveMesh.geometry.userData.origY;
        const count = posAttr.count;

        for (let i = 0; i < count; i++) {
          const ox = origX[i];
          const oy = origY[i];

          const w1 = Math.sin(ox * 2.2 + oy * 1.5 + time * 2.4) * (0.055 * amp);
          const w2 = Math.cos(ox * 3.1 - oy * 2.0 + time * 1.9) * (0.035 * amp);
          const w3 = Math.sin((ox + oy) * 4.6 + time * 3.4) * (0.018 * amp);
          const dist = Math.hypot(ox, oy);
          const w4 = Math.cos(dist * 4.0 - time * 2.7) * (0.016 * amp);

          posAttr.array[i * 3 + 2] = w1 + w2 + w3 + w4;
        }
        posAttr.needsUpdate = true;
        waveMesh.geometry.computeVertexNormals();

        waveMesh.material.emissiveIntensity = 0.42 + Math.sin(time * 2.5) * (0.08 * amp);
      }

      // 2. Meniscus bobbing
      if (meniscusMesh) {
        meniscusMesh.position.y = (BLOCK_HEIGHT / 2 + 0.018) + Math.sin(time * 2.2) * (0.015 * amp);
      }

      // 3. Moving Sunlight Caustic Rays
      if (sunCausticLight) {
        sunCausticLight.position.x = Math.sin(time * 1.1) * 2.2 - 1.0;
        sunCausticLight.position.z = Math.cos(time * 0.9) * 2.2;
        sunCausticLight.position.y = BLOCK_HEIGHT / 2 + 3.0 + Math.sin(time * 1.8) * 0.3;
      }

      // 4. Suspended Marine Snow & Plankton Drift
      if (particlesMesh && particleVelocities.length > 0) {
        const pArray = particlesMesh.geometry.attributes.position.array;
        const pCount = particleVelocities.length;
        for (let i = 0; i < pCount; i++) {
          const vel = particleVelocities[i];
          pArray[i * 3] += vel.vx;
          pArray[i * 3 + 2] += vel.vz;
          pArray[i * 3 + 1] += Math.sin(time * vel.bobFreq) * vel.bobAmp;

          // Boundary wrap
          if (geometryType === 'cylinder') {
            const dSq = pArray[i * 3] * pArray[i * 3] + pArray[i * 3 + 2] * pArray[i * 3 + 2];
            if (dSq > (BLOCK_RADIUS * 0.92) * (BLOCK_RADIUS * 0.92)) {
              pArray[i * 3] *= -0.92;
              pArray[i * 3 + 2] *= -0.92;
            }
          } else {
            const hw = (BLOCK_WIDTH * 0.92) / 2;
            if (Math.abs(pArray[i * 3]) > hw) pArray[i * 3] *= -0.94;
            if (Math.abs(pArray[i * 3 + 2]) > hw) pArray[i * 3 + 2] *= -0.94;
          }
        }
        particlesMesh.geometry.attributes.position.needsUpdate = true;
      }

      // 5. Lateral Slide-out Physics Animation & Wave Dynamics for Extracted Slices
      layerGroups.forEach(grp => {
        const { baseY, idx, sliceWaveMesh } = grp.userData;

        // Smooth spring lerp for sliding out of the main block
        grp.userData.curX += (grp.userData.targetX - grp.userData.curX) * 0.085;
        grp.userData.curZ += (grp.userData.targetZ - grp.userData.curZ) * 0.085;
        grp.userData.curLift += (grp.userData.targetLift - grp.userData.curLift) * 0.085;
        grp.userData.curScale += (grp.userData.targetScale - grp.userData.curScale) * 0.085;

        grp.position.x = grp.userData.curX;
        grp.position.z = grp.userData.curZ;
        grp.scale.setScalar(grp.userData.curScale);

        // Internal vertical wave bobbing with elevated presentation
        grp.position.y = baseY + grp.userData.curLift + Math.sin(time * 1.3 + idx * 0.45) * (0.012 * amp);

        // ── Real-time 3D Waves on the Extracted Water Slice ──
        if (sliceWaveMesh && sliceWaveMesh.geometry.userData.origX) {
          const isExtracted = grp.userData.curX > 0.15;
          const slideProgress = Math.min(1.0, grp.userData.curX / 3.0);
          const sPos = sliceWaveMesh.geometry.attributes.position;
          const sOrigX = sliceWaveMesh.geometry.userData.origX;
          const sOrigY = sliceWaveMesh.geometry.userData.origY;
          const sCount = sPos.count;

          // Water wave motion amplitude increases as the slice slides out into free space
          const sliceWaveAmp = (amp * (isExtracted ? 1.35 : 0.2)) * Math.max(0.15, slideProgress);

          for (let j = 0; j < sCount; j++) {
            const ox = sOrigX[j];
            const oy = sOrigY[j];
            const sw1 = Math.sin(ox * 3.0 + oy * 2.2 + time * 3.0) * (0.045 * sliceWaveAmp);
            const sw2 = Math.cos(ox * 3.8 - oy * 2.6 + time * 2.3) * (0.032 * sliceWaveAmp);
            const sdist = Math.hypot(ox, oy);
            const sw3 = Math.cos(sdist * 5.2 - time * 3.2) * (0.02 * sliceWaveAmp);

            sPos.array[j * 3 + 2] = sw1 + sw2 + sw3;
          }
          sPos.needsUpdate = true;
          sliceWaveMesh.geometry.computeVertexNormals();

          // Dynamic wave crest foam shine for the extracted water slab
          if (isExtracted) {
            sliceWaveMesh.material.emissiveIntensity = 0.55 + Math.sin(time * 2.8) * 0.15;
          }
        }
      });

      // 6. Update Tether Line, Socket Marker & Floating HUD Card
      const activeGrp = layerGroups[selectedDepthIndex];
      if (activeGrp) {
        const curX = activeGrp.userData.curX;
        const curZ = activeGrp.userData.curZ;
        const curY = activeGrp.position.y;
        const baseY = activeGrp.userData.baseY;

        // Tether line between column socket and extracted slice
        if (tetherLine) {
          const tPos = tetherLine.geometry.attributes.position.array;
          tPos[0] = 0;    tPos[1] = baseY; tPos[2] = 0;
          tPos[3] = curX; tPos[4] = curY;  tPos[5] = curZ;
          tetherLine.geometry.attributes.position.needsUpdate = true;
          tetherLine.material.opacity = Math.min(0.85, Math.max(0, curX / 2.5));
        }


        // Column extraction socket gap in main block
        if (extractionSocket) {
          extractionSocket.position.y = baseY;
          if (extractionSocket.material) {
            extractionSocket.material.opacity = Math.min(0.75, Math.max(0, curX / 2.5));
          }
        }

        // Floating 3D Holographic HUD Info Card - Elevated comfortably above the slice
        if (extractedHudSprite) {
          extractedHudSprite.position.set(curX, curY + 1.25, curZ);
          extractedHudSprite.material.opacity = Math.min(1.0, Math.max(0, (curX - 0.4) / 2.0));
        }
      }

      renderer.render(scene, camera);
    }

    // ─── Init ────────────────────────────────────────────────────────────────────
    const coordsStr = `${Math.abs(queryLat).toFixed(4)}°${queryLat >= 0 ? 'N' : 'S'}, ${Math.abs(queryLon).toFixed(4)}°${queryLon >= 0 ? 'E' : 'W'}`;
    const titleSub = document.querySelector('.title-sub');
    if (titleSub) titleSub.textContent = `${coordsStr} • Arabian Sea`;
    const headerCoords = document.querySelector('.panel-header .coords');
    if (headerCoords) headerCoords.textContent = coordsStr;

    onResize();
    rebuild3D();
    renderPanel();
    updateLegendWidget();
    animate();

    // Update layer count in tab
    document.getElementById('layer-count').textContent = WATER_COLUMN.length;
  </script>
</body>
</html>
